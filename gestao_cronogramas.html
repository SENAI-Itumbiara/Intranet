<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Cronogramas de Cursos</title>
  <style>
    :root {
      --bg: #f5f9ff;
      --surface: #ffffff;
      --surface-soft: #eef5ff;
      --text: #17324d;
      --muted: #6f8296;
      --primary: #1268b3;
      --primary-dark: #0b4f8a;
      --border: #dce8f4;
      --shadow: 0 10px 28px rgba(34, 74, 111, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f8fbff 0%, #f3f8fd 100%);
      color: var(--text);
    }

    .page {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .title-wrap h1 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 3vw, 2.5rem);
      line-height: 1.1;
      color: #0f3f69;
    }

    .title-wrap p {
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .summary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 18px;
      box-shadow: var(--shadow);
      min-width: 180px;
      text-align: center;
    }

    .summary strong {
      display: block;
      font-size: 1.65rem;
      color: var(--primary);
      line-height: 1;
      margin-bottom: 5px;
    }

    .summary span { color: var(--muted); font-size: 0.88rem; }

    .filters {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 22px;
    }

    .filters-grid {
      display: grid;
      grid-template-columns: 2fr repeat(4, minmax(150px, 1fr));
      gap: 12px;
    }

    .field { min-width: 0; }

    label {
      display: block;
      font-size: 0.78rem;
      color: #557086;
      margin: 0 0 6px 3px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    input, select {
      width: 100%;
      height: 44px;
      border: 1px solid #cfddec;
      border-radius: 11px;
      background: #fbfdff;
      color: var(--text);
      padding: 0 12px;
      outline: none;
      font-size: 0.92rem;
      transition: .2s ease;
    }

    input:focus, select:focus {
      border-color: #78aee0;
      box-shadow: 0 0 0 3px rgba(18, 104, 179, .10);
    }

    .filter-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .btn-clear {
      border: 0;
      border-radius: 10px;
      background: #e8f2fb;
      color: #0f5f9e;
      font-weight: 700;
      padding: 10px 16px;
      cursor: pointer;
    }

    .btn-clear:hover { background: #dbeafa; }

    .content-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 2px 14px;
    }

    .content-head h2 {
      margin: 0;
      font-size: 1.05rem;
      color: #274d6d;
    }

    .count {
      color: var(--muted);
      font-size: .9rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }

    .card {
      --status-color: #7d91a6;
      --status-bg: #eef2f6;
      position: relative;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(39, 80, 119, .07);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: var(--status-color);
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(39, 80, 119, .12);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .course-name {
      margin: 0;
      font-size: 1.02rem;
      line-height: 1.35;
      color: #143c5e;
      font-weight: 800;
    }

    .badge {
      flex: 0 0 auto;
      padding: 6px 9px;
      border-radius: 999px;
      background: var(--status-bg);
      color: var(--status-color);
      font-size: .75rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 14px;
    }

    .meta-item {
      background: #f8fbfe;
      border: 1px solid #edf3f8;
      border-radius: 11px;
      padding: 9px 10px;
      min-width: 0;
    }

    .meta-item .k {
      display: block;
      color: #7b8da0;
      font-size: .7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .035em;
      margin-bottom: 3px;
    }

    .meta-item .v {
      display: block;
      color: #284964;
      font-size: .87rem;
      line-height: 1.35;
      word-wrap: break-word;
    }

    .card-actions {
      margin-top: 14px;
      display: flex;
      justify-content: flex-end;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-decoration: none;
      background: #0f68b2;
      color: white;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: .86rem;
      font-weight: 800;
    }

    .link-btn:hover { background: #0b5797; }

    .link-btn.disabled {
      background: #d9e2ea;
      color: #718294;
      pointer-events: none;
    }

    .message {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px dashed #bfd1e2;
      border-radius: 16px;
      padding: 34px 20px;
      text-align: center;
      color: var(--muted);
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 40px;
      color: var(--muted);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3px solid #dbe8f4;
      border-top-color: var(--primary);
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1100px) {
      .filters-grid { grid-template-columns: repeat(3, 1fr); }
      .search-field { grid-column: span 3; }
    }

    @media (max-width: 720px) {
      .page { width: min(100% - 20px, 1440px); padding-top: 18px; }
      .header { flex-direction: column; }
      .summary { width: 100%; }
      .filters-grid { grid-template-columns: 1fr; }
      .search-field { grid-column: auto; }
      .meta { grid-template-columns: 1fr; }
      .cards { grid-template-columns: 1fr; }
      .card-top { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="header">
      <div class="title-wrap">
        <h1>Gestão de Cronogramas de Cursos</h1>
        <p>Localize rapidamente os cronogramas por status, cidade, área tecnológica, modalidade, evento ou curso.</p>
      </div>
      <div class="summary">
        <strong id="totalCount">0</strong>
        <span>cronogramas encontrados</span>
      </div>
    </section>

    <section class="filters" aria-label="Filtros">
      <div class="filters-grid">
        <div class="field search-field">
          <label for="search">Busca rápida</label>
          <input id="search" type="search" placeholder="Digite curso, evento, cidade, área, público, observação..." />
        </div>
        <div class="field">
          <label for="statusFilter">Status</label>
          <select id="statusFilter"><option value="">Todos</option></select>
        </div>
        <div class="field">
          <label for="cityFilter">Cidade</label>
          <select id="cityFilter"><option value="">Todas</option></select>
        </div>
        <div class="field">
          <label for="areaFilter">Área tecnológica</label>
          <select id="areaFilter"><option value="">Todas</option></select>
        </div>
        <div class="field">
          <label for="modalityFilter">Modalidade</label>
          <select id="modalityFilter"><option value="">Todas</option></select>
        </div>
      </div>
      <div class="filter-actions">
        <button class="btn-clear" id="clearFilters" type="button">Limpar filtros</button>
      </div>
    </section>

    <section>
      <div class="content-head">
        <h2>Cronogramas</h2>
        <div class="count" id="filterInfo">Carregando dados...</div>
      </div>
      <div id="cards" class="cards">
        <div class="loading"><span class="spinner"></span> Carregando cronogramas...</div>
      </div>
    </section>
  </main>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSl5vDwDpJHouTSFt7v7FsRUdGOfJqeCxkJKWk6tATvg5SesXIR-pJKZeHy3TAcqDRccWrVlGUTjz1v/pub?output=csv';

    const $ = (id) => document.getElementById(id);
    const els = {
      cards: $('cards'),
      search: $('search'),
      status: $('statusFilter'),
      city: $('cityFilter'),
      area: $('areaFilter'),
      modality: $('modalityFilter'),
      clear: $('clearFilters'),
      total: $('totalCount'),
      info: $('filterInfo')
    };

    let data = [];

    function normalize(value = '') {
      return String(value)
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .trim()
        .toLowerCase();
    }

    function escapeHtml(value = '') {
      return String(value).replace(/[&<>'"]/g, ch => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;'
      })[ch]);
    }

    function parseCSV(text) {
      const rows = [];
      let row = [], cell = '', quoted = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (ch === '"') {
          if (quoted && next === '"') {
            cell += '"';
            i++;
          } else {
            quoted = !quoted;
          }
        } else if (ch === ',' && !quoted) {
          row.push(cell);
          cell = '';
        } else if ((ch === '\n' || ch === '\r') && !quoted) {
          if (ch === '\r' && next === '\n') i++;
          row.push(cell);
          if (row.some(v => String(v).trim() !== '')) rows.push(row);
          row = [];
          cell = '';
        } else {
          cell += ch;
        }
      }

      if (cell.length || row.length) {
        row.push(cell);
        if (row.some(v => String(v).trim() !== '')) rows.push(row);
      }
      return rows;
    }

    function mapRows(rows) {
      if (!rows.length) return [];
      return rows.slice(1).map(r => ({
        status: r[0]?.trim() || '',
        city: r[1]?.trim() || '',
        area: r[2]?.trim() || '',
        modality: r[3]?.trim() || '',
        event: r[4]?.trim() || '',
        course: r[5]?.trim() || '',
        schedule: r[6]?.trim() || '',
        audience: r[7]?.trim() || '',
        note: r[8]?.trim() || '',
        councilDate: r[9]?.trim() || '',
        url: r[10]?.trim() || ''
      })).filter(item => Object.values(item).some(Boolean));
    }

    function statusStyle(status) {
      const s = normalize(status);
      if (!s) return { color: '#6e8296', bg: '#edf2f6' };
      if (/conclu|finaliz|encerr|realiz/.test(s)) return { color: '#2f7d55', bg: '#e8f6ee' };
      if (/andamento|execu|ativo|aberto/.test(s)) return { color: '#1468ad', bg: '#e7f2fc' };
      if (/pend|aguard|elabora|planej/.test(s)) return { color: '#9a6a13', bg: '#fff5da' };
      if (/cancel|suspens|inativ/.test(s)) return { color: '#a34848', bg: '#fdecec' };
      if (/atras|vencid|critico|crítico/.test(s)) return { color: '#b14f18', bg: '#fff0e6' };
      return { color: '#6a5a9f', bg: '#f0edfb' };
    }

    function setOptions(select, values) {
      const current = select.value;
      const unique = [...new Set(values.filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
      select.innerHTML = select.options[0].outerHTML + unique.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');
      if (unique.includes(current)) select.value = current;
    }

    function populateFilters() {
      setOptions(els.status, data.map(x => x.status));
      setOptions(els.city, data.map(x => x.city));
      setOptions(els.area, data.map(x => x.area));
      setOptions(els.modality, data.map(x => x.modality));
    }

    function validUrl(url) {
      try {
        const u = new URL(url);
        return ['http:', 'https:'].includes(u.protocol);
      } catch { return false; }
    }

    function render() {
      const q = normalize(els.search.value);
      const status = normalize(els.status.value);
      const city = normalize(els.city.value);
      const area = normalize(els.area.value);
      const modality = normalize(els.modality.value);

      const filtered = data.filter(item => {
        const blob = normalize(Object.values(item).join(' '));
        return (!q || blob.includes(q)) &&
          (!status || normalize(item.status) === status) &&
          (!city || normalize(item.city) === city) &&
          (!area || normalize(item.area) === area) &&
          (!modality || normalize(item.modality) === modality);
      });

      els.total.textContent = filtered.length;
      els.info.textContent = `${filtered.length} de ${data.length} registro${data.length === 1 ? '' : 's'}`;

      if (!filtered.length) {
        els.cards.innerHTML = `<div class="message"><strong>Nenhum cronograma encontrado.</strong><br>Tente ajustar os filtros ou a busca.</div>`;
        return;
      }

      els.cards.innerHTML = filtered.map(item => {
        const style = statusStyle(item.status);
        const link = validUrl(item.url)
          ? `<a class="link-btn" href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">Abrir cronograma ↗</a>`
          : `<span class="link-btn disabled">Link indisponível</span>`;

        return `
          <article class="card" style="--status-color:${style.color};--status-bg:${style.bg}">
            <div class="card-top">
              <h3 class="course-name">${escapeHtml(item.course || 'Curso não informado')}</h3>
              <span class="badge">${escapeHtml(item.status || 'Sem status')}</span>
            </div>
            <div class="meta">
              <div class="meta-item"><span class="k">Cidade</span><span class="v">${escapeHtml(item.city || '—')}</span></div>
              <div class="meta-item"><span class="k">Área</span><span class="v">${escapeHtml(item.area || '—')}</span></div>
              <div class="meta-item"><span class="k">Modalidade</span><span class="v">${escapeHtml(item.modality || '—')}</span></div>
              <div class="meta-item"><span class="k">Evento</span><span class="v">${escapeHtml(item.event || '—')}</span></div>
              <div class="meta-item"><span class="k">Horário / Turno</span><span class="v">${escapeHtml(item.schedule || '—')}</span></div>
              <div class="meta-item"><span class="k">Conselho de classe</span><span class="v">${escapeHtml(item.councilDate || '—')}</span></div>
            </div>
            <div class="card-actions">${link}</div>
          </article>`;
      }).join('');
    }

    async function loadData() {
      try {
        const res = await fetch(CSV_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        data = mapRows(parseCSV(text));
        populateFilters();
        render();
      } catch (err) {
        console.error(err);
        els.total.textContent = '0';
        els.info.textContent = 'Falha ao carregar';
        els.cards.innerHTML = `
          <div class="message">
            <strong>Não foi possível carregar a planilha.</strong><br><br>
            Verifique se a planilha continua publicada como CSV e se o navegador permite acesso ao endereço informado.<br>
            <small>Detalhe técnico: ${escapeHtml(err.message)}</small>
          </div>`;
      }
    }

    [els.search, els.status, els.city, els.area, els.modality].forEach(el => {
      el.addEventListener(el.tagName === 'INPUT' ? 'input' : 'change', render);
    });

    els.clear.addEventListener('click', () => {
      els.search.value = '';
      els.status.value = '';
      els.city.value = '';
      els.area.value = '';
      els.modality.value = '';
      render();
    });

    loadData();
  </script>
</body>
</html>
