<script>
'use strict';

const BASE='https://docs.google.com/spreadsheets/d/e/2PACX-1vT-xLmTG3YO2-AEtFLfB-Evrab4DwSWbqvdqbCN3NIAnimgJ5-Z7Z_v679sOL3qL2gceQT99GHrVSei/pub';
const SOURCES=[
  {id:'senai',label:'Realizado SENAI',gid:'0',url:BASE+'?gid=0&single=true&output=csv'},
  {id:'sesi',label:'Realizado SESI',gid:'1788998690',url:BASE+'?gid=1788998690&single=true&output=csv'},
  {id:'metas',label:'Metas mensais',gid:'1459671764',url:BASE+'?gid=1459671764&single=true&output=csv'}
];
const UNITS=[['all','Todas as unidades'],['senai_itumbiara','SENAI · Itumbiara'],['senai_quirinopolis','SENAI · Quirinópolis'],['sesi_quirinopolis','SESI · Quirinópolis']];
const M=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MONTHS=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const el=document.getElementById('app');
const FMT=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:2});
const FMT0=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const INT=new Intl.NumberFormat('pt-BR');
let state={page:'overview',unit:'all',year:new Date().getFullYear(),start:1,end:new Date().getMonth()||12,metric:'revenue',exploreType:'expense',exploreMode:'group',drill:{group:null,account:null,cr:null},search:'',pageno:0,offmode:'invest',loading:true,updated:null,errors:[],health:{},rows:[],goals:new Map(),rawCounts:{},ready:false};
let gvizQueue=Promise.resolve();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const money=v=>Number.isFinite(v)?FMT.format(v):'—';
const money0=v=>Number.isFinite(v)?FMT0.format(v):'—';
const pct=v=>Number.isFinite(v)?new Intl.NumberFormat('pt-BR',{style:'percent',minimumFractionDigits:1,maximumFractionDigits:1}).format(v):'—';
const signClass=(v,goodWhenPositive=true)=>!Number.isFinite(v)?'neutralText':Math.abs(v)<.005?'neutralText':(v>0)===goodWhenPositive?'goodText':'badText';
const num=v=>{if(typeof v==='number')return Number.isFinite(v)?v:null;if(v===null||v===undefined||String(v).trim()==='')return null;let s=String(v).trim().replace(/\s|\u00a0|R\$/g,'');let neg=/^\(.*\)$/.test(s);s=s.replace(/[()]/g,'');s=s.replace(/[^0-9.,+\-]/g,'');if(!s)return null;if(s.includes(',')&&s.includes('.')){s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');}else if(s.includes(',')){s=s.replace(',','.');}else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'');}let n=Number(s);return Number.isFinite(n)?(neg?-Math.abs(n):n):null;};
function parseCSV(input){const txt=String(input??'').replace(/^\ufeff/,'');if(/^\s*</.test(txt))throw Error('A fonte retornou HTML em vez de CSV. Confira se a aba está publicada.');const head=txt.split(/\r?\n/)[0]||'';const separator=(head.match(/;/g)||[]).length>(head.match(/,/g)||[]).length?';':',';let rows=[],row=[],field='',quoted=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(quoted){if(c==='"'&&txt[i+1]==='"'){field+='"';i++;}else if(c==='"')quoted=false;else field+=c;}else{if(c==='"')quoted=true;else if(c===separator){row.push(field);field='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];field='';}else field+=c;}}row.push(field);if(row.some(x=>x.trim()!==''))rows.push(row);if(rows.length<1)throw Error('O CSV está vazio.');return rows;}
function tableObject(arr){let header=arr[0].map(x=>String(x??'').trim());let normed=header.map(norm);return arr.slice(1).map(c=>{let o={};for(let j=0;j<header.length;j++)o[normed[j]]=c[j]??'';return o;});}
function get(o,...keys){for(const k of keys){const v=o[norm(k)];if(v!==undefined)return v;}return '';}
const toMonth=v=>{let s=norm(v);let idx=M.indexOf(s.slice(0,3));if(idx>=0)return idx+1;const n=Number(s);return Number.isInteger(n)&&n>=1&&n<=12?n:0;};
function detectUnit(source,orig){let s=norm(orig);if(source==='sesi')return 'sesi_quirinopolis';if(s.includes('itumbiara'))return 'senai_itumbiara';if(s.includes('quirinopolis'))return 'senai_quirinopolis';return null;}
function normalizeActuals(matrix,source){let objects=tableObject(matrix);const header=matrix[0].map(norm);let required=['despesa receita','ano','mes','unidade','nomeconta'];for(let col of required){if(!header.includes(col))throw Error('Coluna obrigatória não encontrada: '+col);}if(!header.some(x=>x.includes('dre')))throw Error('A coluna Valor Realizado (DRE) não foi encontrada.');
let out=[],ignored=0;for(let i=0;i<objects.length;i++){let r=objects[i];let year=parseInt(get(r,'Ano'),10),month=toMonth(get(r,'Mês','Mes')),unit=detectUnit(source,get(r,'Unidade'));let type=norm(get(r,'Despesa/Receita'));type=type.includes('despes')?'expense':type.includes('receit')?'revenue':null;
 if(!year||!month||!unit||!type){ignored++;continue;}
 let dre=num(get(r,'Valor Realizado (DRE - exceto projetos)','Valor Realizado (DRE exceto projetos)'));if(dre===null){const key=Object.keys(r).find(x=>x.startsWith('valor realizado dre'));dre=key?num(r[key]):null;}
 let orig=num(get(r,'Valor Realizado','Valor Realizado (ORÇAMENTO)','Valor Realizado (ORCAMENTO)'));let group=String(get(r,'Grupo Conta','Grupo03')||'Sem grupo').trim();let acc=String(get(r,'NomeConta')||'Não informada').trim();let cr=String(get(r,'NomeCR')||'Não informado').trim();let amount=(dre===null?0:dre)*(type==='expense'?-1:1);
 let isInvest=norm(group)==='investimentos';let extra=((isInvest||Math.abs(dre||0)<.000001)&&orig!==null&&Math.abs(orig)>0.000001);
 // SENAI exporta despesas realizadas negativas; SESI exporta despesas realizadas positivas.
 let offamount=type==='expense'?(source==='senai'?-orig:orig):orig;
 out.push({source,id:String(get(r,'IdLancamento')),unit,year,month,type,group,account:acc,code:String(get(r,'CodConta')),cr,crCode:String(get(r,'CodCR')),classCr:String(get(r,'ClassificacaoCR')),cost:String(get(r,'CentroCusto')),history:String(get(r,'Histórico do Gasto')),dre:(dre??0),orig,amount,isDre:!isInvest&&Math.abs(dre||0)>.000001,extra,isInvest,offamount,idx:i+2});}
 return {out,ignored};}
function normalizeGoals(matrix){let list=tableObject(matrix);const h=matrix[0].map(norm);for(const x of ['mes','ano'])if(!h.includes(x))throw Error('Metas: coluna '+x+' não encontrada.');let out=new Map(),ignored=0,seen=new Set();let columns=[['sesi_quirinopolis','Receita SESI','Despesa SESI'],['senai_quirinopolis','Receita SENAI Quirinópolis','Despesa SENAI Quirinópolis'],['senai_itumbiara','Receita SENAI Itumbiara','Despesa SENAI Itumbiara']];
 for(let r of list){let year=parseInt(get(r,'Ano'),10),month=toMonth(get(r,'Mês'));if(!year||!month){ignored++;continue;}for(let [unit,re,ex] of columns){let rv=num(get(r,re)),ev=num(get(r,ex));if(rv===null&&ev===null)continue;let key=[year,month,unit].join('|');if(seen.has(key))throw Error('Metas: duplicidade de unidade e competência ('+key+').');seen.add(key);out.set(key,{year,month,unit,revenue:rv,expense:ev});}}
 if(!out.size)throw Error('Nenhuma meta válida identificada. Confira os nomes das colunas.');return {out,ignored};}
async function fetchWithTimeout(url,ms=16000){let controller=new AbortController();let timer=setTimeout(()=>controller.abort(),ms);try{let r=await fetch(url,{cache:'no-store',signal:controller.signal,redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);return await r.text();}finally{clearTimeout(timer);}}
function gvizURL(source){const id=BASE.split('/pub')[0];return id+'/gviz/tq?gid='+encodeURIComponent(source.gid)+'&headers=1&tqx=out:json&nocache='+Date.now();}
function jsonpGviz(source){return new Promise((resolve,reject)=>{const oldGoogle=window.google,oldVis=oldGoogle&&oldGoogle.visualization,oldQuery=oldVis&&oldVis.Query,oldSet=oldQuery&&oldQuery.setResponse;let timer=null,done=false,sc=document.createElement('script');function finish(err,data){if(done)return;done=true;clearTimeout(timer);sc.remove();if(oldSet)window.google.visualization.Query.setResponse=oldSet;else if(window.google?.visualization?.Query)delete window.google.visualization.Query.setResponse;if(err)reject(err);else resolve(data);}
 window.google=window.google||{};window.google.visualization=window.google.visualization||{};window.google.visualization.Query=window.google.visualization.Query||{};window.google.visualization.Query.setResponse=res=>{if(res.status&&res.status!=='ok')return finish(Error('GViz: '+(res.errors?.[0]?.message||res.status)));if(!res.table)return finish(Error('Resposta GViz sem tabela.'));let cols=res.table.cols.map((c,i)=>String(c.label||c.id||'Coluna '+i));let rows=[cols,...res.table.rows.map(r=>(r.c||[]).map(c=>c?c.f??c.v??'':''))];finish(null,rows);};sc.src=gvizURL(source);sc.onerror=()=>finish(Error('A consulta alternativa ao Google Sheets foi bloqueada.'));timer=setTimeout(()=>finish(Error('Tempo esgotado na consulta alternativa.')),14000);document.head.append(sc);});}
function viaGviz(source){let task=gvizQueue.then(()=>jsonpGviz(source));gvizQueue=task.catch(()=>{});return task;}
async function loadSource(source){try{let txt=await fetchWithTimeout(source.url);return {matrix:parseCSV(txt),method:'CSV'};}catch(e){try{let matrix=await viaGviz(source);return {matrix,method:'Google Visualization'};}catch(e2){throw Error('CSV: '+e.message+' | Alternativa: '+e2.message);}}}
async function refresh(){if(state.loading&&state.ready)return;state.loading=true;state.errors=[];SOURCES.forEach(x=>state.health[x.id]='loading');render();let result=await Promise.all(SOURCES.map(async source=>{try{let r=await loadSource(source);let processed=source.id==='metas'?normalizeGoals(r.matrix):normalizeActuals(r.matrix,source.id);return {id:source.id,status:'ok',method:r.method,processed,records:r.matrix.length-1};}catch(error){return{id:source.id,status:'err',error:String(error.message||error)};}}));
 let newRows=[],newGoals=new Map(),bad=[];for(let a of result){state.health[a.id]=a.status; if(a.status==='err'){bad.push(SOURCES.find(x=>x.id===a.id).label+': '+a.error);continue;}state.rawCounts[a.id]=a.records;if(a.id==='metas')newGoals=a.processed.out;else newRows.push(...a.processed.out);if(a.processed.ignored)bad.push(a.id+': '+a.processed.ignored+' registros sem chave válida foram ignorados.');if(a.id!=='metas'){let invWithDre=a.processed.out.filter(r=>r.isInvest&&Math.abs(r.dre)>.000001).length;if(invWithDre)bad.push(a.id+': '+invWithDre+' investimento(s) com valor na coluna DRE foram excluídos preventivamente. Revisar na origem.');}if(a.method!=='CSV')bad.push(SOURCES.find(x=>x.id===a.id).label+': carregado por consulta alternativa (CSV não acessível pelo navegador).');}
 // Atualizações parciais preservam conjuntos previamente carregados, se disponíveis.
 let okActual=result.filter(x=>x.status==='ok'&&x.id!=='metas').map(x=>x.id);if(okActual.length){state.rows=state.rows.filter(r=>!okActual.includes(r.source)).concat(newRows);}if(result.some(x=>x.id==='metas'&&x.status==='ok'))state.goals=newGoals;
 state.errors=bad;state.loading=false;state.updated=new Date();state.ready=true;let yrs=availableYears();if(!yrs.includes(state.year)){state.year=yrs.includes(new Date().getFullYear())?new Date().getFullYear():yrs[yrs.length-1]||new Date().getFullYear();state.end=defaultEnd(state.year);}render();}
const unitsSelected=()=>state.unit==='all'?UNITS.slice(1).map(x=>x[0]):[state.unit];

function defaultEnd(y){const now=new Date();return y===now.getFullYear()?Math.max(1,now.getMonth()):12;}
function actuals(){return state.rows.filter(r=>r.isDre&&isInPeriod(r));}
function sum(rows,field){return rows.reduce((s,r)=>s+(Number(r[field])||0),0);}
function totals(rows){let a={revenue:0,expense:0,result:0,count:rows.length};for(let r of rows){a[r.type==='expense'?'expense':'revenue']+=r.amount;}a.result=a.revenue-a.expense;return a;}
function goalValue(year,month,unit,key){let g=state.goals.get([year,month,unit].join('|'));return g?g[key]:null;}
function periodGoals(){let s={revenue:0,expense:0,rvN:0,exN:0,expected:(state.end-state.start+1)*unitsSelected().length};for(let m=state.start;m<=state.end;m++)for(let unit of unitsSelected()){let rv=goalValue(state.year,m,unit,'revenue'),ev=goalValue(state.year,m,unit,'expense');if(rv!==null){s.rvN++;s.revenue+=rv;}if(ev!==null){s.exN++;s.expense+=ev;}}return {revenue:s.rvN===s.expected?s.revenue:null,expense:s.exN===s.expected?s.expense:null,rvN:s.rvN,exN:s.exN,expected:s.expected};}
function actualCoverage(){let have=new Set(actuals().map(r=>[r.year,r.month,r.unit].join('|')));return {covered:have.size,expected:(state.end-state.start+1)*unitsSelected().length,any:have.size>0,complete:have.size===(state.end-state.start+1)*unitsSelected().length};}
function metrics(){const a=totals(actuals()),g=periodGoals(),coverage=actualCoverage();return {a,g,coverage,compR:!coverage.complete||g.revenue===null?null:a.revenue-g.revenue,compE:!coverage.complete||g.expense===null?null:a.expense-g.expense,compResult:!coverage.complete||g.revenue===null||g.expense===null?null:a.result-(g.revenue-g.expense)};}
function monthly(){let arr=[];for(let m=state.start;m<=state.end;m++){let ar=state.rows.filter(r=>r.isDre&&r.year===state.year&&r.month===m&&unitsSelected().includes(r.unit));let a=totals(ar);let gr=0,ge=0,nr=0,ne=0;for(let unit of unitsSelected()){let r=goalValue(state.year,m,unit,'revenue'),e=goalValue(state.year,m,unit,'expense');if(r!==null){gr+=r;nr++;}if(e!==null){ge+=e;ne++;}}arr.push({month:m,...a,goalR:nr===unitsSelected().length?gr:null,goalE:ne===unitsSelected().length?ge:null,hasActual:ar.length>0,fullActual:(new Set(ar.map(r=>r.unit)).size===unitsSelected().length)});}return arr;}
function fmtDelta(v,favor=true){return !Number.isFinite(v)?'<span class="neutralText">—</span>':'<span class="'+signClass(v,favor)+'">'+(v>0?'+':'')+money(v)+'</span>';}

const seriesColors={revenue:'#0a898a',expense:'#3477aa',result:'#655aa3',target:'#d6a463'};
function lineChart(arr,key,targetKey){let w=760,h=277,ml=65,mr=17,mt=21,mb=40,ih=h-mt-mb,iw=w-ml-mr;let vals=arr.flatMap(r=>[r.hasActual?r[key]:null,r[targetKey]]).filter(Number.isFinite);if(!vals.length)return emptyMsg('Sem valores para o gráfico','Selecione um período com dados disponíveis.');let min=Math.min(0,...vals),max=Math.max(0,...vals);if(min===max)max=min+1;let pad=(max-min)*.10;min-=pad;max+=pad;const y=v=>mt+(max-v)/(max-min)*ih,x=i=>ml+(arr.length===1?iw/2:i*iw/(arr.length-1));let lines='';for(let j=0;j<5;j++){const v=min+(max-min)*j/4,yy=y(v);lines+=`<line x1="${ml}" y1="${yy}" x2="${w-mr}" y2="${yy}" stroke="#e9eef1"/><text x="${ml-10}" y="${yy+4}" text-anchor="end" font-size="10" fill="#8ca0aa">${esc(compact(v))}</text>`;}
 function createLine(k,color,predicate){let segments=[],curr=[];arr.forEach((r,i)=>{let val=k==='current'?(r.hasActual?r[key]:null):r[targetKey];if(Number.isFinite(val)){curr.push([i,val]);}else if(curr.length){segments.push(curr);curr=[];}});if(curr.length)segments.push(curr);return segments.map(a=>{let d=a.map(([i,v],j)=>(j?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');return `<path d="${d}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" ${k==='target'?'stroke-dasharray="6 5"':''}/>`+a.map(([i,v])=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.3" fill="${color}" stroke="white" stroke-width="1.5"><title>${MONTHS[arr[i].month-1]}: ${money(v)}</title></circle>`).join('');}).join('');}

function compact(x){const abs=Math.abs(x),sgn=x<0?'−':'';if(abs>=1e6)return sgn+new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format(abs/1e6)+' mi';if(abs>=1000)return sgn+new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}).format(abs/1000)+' mil';return sgn+new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}).format(abs);}
function groupRows(rows,field,type=null){let map=new Map();for(let r of rows){if(type&&r.type!==type)continue;let key=String(r[field]||'Não informado');let x=map.get(key)||{name:key,amount:0,count:0,revenue:0,expense:0};x.amount+=r.amount;x[r.type]+=r.amount;x.count++;map.set(key,x);}return [...map.values()].sort((a,b)=>b.amount-a.amount);}

function forecastCalc(){const now=new Date(),closing=state.year<now.getFullYear()?12:state.year===now.getFullYear()?now.getMonth():0; if(closing<1)return null;let sel=unitsSelected(),r=0,e=0,last=0;for(let m=1;m<=12;m++){if(m<=closing){let rows=state.rows.filter(x=>x.isDre&&x.year===state.year&&x.month===m&&sel.includes(x.unit));let names=new Set(rows.map(x=>x.unit));if(sel.some(x=>!names.has(x)))return null;let a=totals(rows);r+=a.revenue;e+=a.expense;last=m;}else{for(let u of sel){let rv=goalValue(state.year,m,u,'revenue'),ev=goalValue(state.year,m,u,'expense');if(rv===null||ev===null)return null;r+=rv;e+=ev;}}}return {revenue:r,expense:e,result:r-e,last};}

function explorerRows(){return actuals().filter(r=>r.type===state.exploreType&&(!state.drill.group||r.group===state.drill.group)&&(!state.drill.account||r.account===state.drill.account)&&(!state.drill.cr||r.cr===state.drill.cr));}
function explorerMain(){let rows=explorerRows(),step=exploreStep(),field=step==='group'?'group':step==='account'?'account':'cr';let search=norm(state.search);if(step!=='movements'){let groups=groupRows(rows,field);if(search)groups=groups.filter(x=>norm(x.name).includes(search));return `<div class="tablewrap"><table class="datatable"><thead><tr><th>${step==='group'?'Grupo contábil':step==='account'?'Conta contábil':'Centro de resultado'}</th><th class="num">Lançamentos</th><th class="num">Valor líquido</th><th class="num">Participação</th><th></th></tr></thead><tbody>${groups.map(r=>`<tr><td class="clickcell" data-action="chooseDrill" data-field="${field}" data-key="${esc(r.name)}">${esc(r.name)}</td><td class="num">${INT.format(r.count)}</td><td class="num">${money(r.amount)}</td><td class="num">${pct(sum(rows,'amount')!==0?r.amount/sum(rows,'amount'):null)}</td><td class="num"><button data-action="chooseDrill" data-field="${field}" data-key="${esc(r.name)}" class="btn small">Detalhar →</button></td></tr>`).join('')}</tbody></table></div>${groups.length?'':emptyMsg('Sem itens correspondentes','Ajuste a pesquisa ou os filtros.')}`;}
let records=rows.filter(r=>[r.history,r.account,r.cr,r.group,r.code,r.id].some(x=>norm(x).includes(search)));let total=records.length,limit=50,pages=Math.max(1,Math.ceil(total/limit)),page=Math.min(state.pageno,pages-1),part=records.slice(page*limit,(page+1)*limit);return `<div class="tablewrap"><table class="datatable"><thead><tr><th>Mês</th><th>Unidade</th><th>Conta</th><th>Centro de resultado</th><th>Histórico do lançamento</th><th class="num">DRE</th></tr></thead><tbody>${part.map(r=>`<tr><td>${M[r.month-1]}/${r.year}</td><td>${esc(unitTitle(r.unit))}</td><td class="wrap" title="${esc(r.code)}">${esc(r.account)}</td><td class="wrap">${esc(r.cr)}</td><td class="wrap" title="${esc(r.id)}">${esc(r.history)}</td><td class="num">${money(r.amount)}</td></tr>`).join('')}</tbody></table></div><div class="statline"><span>${INT.format(total)} lançamento(s) · valor líquido ${money(sum(records,'amount'))}</span><div class="pagination"><button class="btn small" data-action="pageBack" ${page===0?'disabled':''}>Anterior</button> ${page+1} / ${pages} <button class="btn small" data-action="pageNext" ${page>=pages-1?'disabled':''}>Próximo</button></div></div>`;}
function pageExplore(){let rows=explorerRows(),step=exploreStep(),d=state.drill;let trail=state.exploreMode==='group'?[['group','Grupos',null],['account',d.group,null],['cr',d.account,null],['movements',d.cr,null]]:[['cr','Centros de resultado',null],['group',d.cr,null],['account',d.group,null],['movements',d.account,null]];let selected=state.exploreMode==='group'?[d.group,d.account,d.cr]:[d.cr,d.group,d.account];let breadcrumbs=`<div class="crumb"><button data-action="resetDrill">Início</button>${selected.filter(Boolean).map((x,i)=>`<span>›</span><button data-action="crumb" data-index="${i}">${esc(x)}</button>`).join('')}<span>›</span><span>${step==='movements'?'Lançamentos':step==='group'?'Grupos':step==='account'?'Contas':'Centros'}</span></div>`;
 return `<div class="panel"><div class="panelhead"><div><h2>Explorador de lançamentos</h2><p>Navegue por grupos, contas e centros de resultado até a origem de cada valor.</p></div><span class="pill">${INT.format(rows.length)} registros neste nível</span></div><div class="toolbar"><div class="segmented"><button data-action="exploreType" data-value="expense" class="${state.exploreType==='expense'?'active':''}">Despesas</button><button data-action="exploreType" data-value="revenue" class="${state.exploreType==='revenue'?'active':''}">Receitas</button></div><div class="segmented"><button data-action="exploreMode" data-value="group" class="${state.exploreMode==='group'?'active':''}">Por conta</button><button data-action="exploreMode" data-value="cr" class="${state.exploreMode==='cr'?'active':''}">Por CR</button></div></div>${breadcrumbs}<div class="toolbar"><input class="control search" type="search" value="${esc(state.search)}" data-control="search" placeholder="Pesquisar ${step==='movements'?'histórico, conta ou CR':'nome do agrupamento'}..."/><button class="btn small" data-action="resetDrill">Limpar navegação</button>${step==='movements'?'<button class="btn small primary" data-action="csvRecords">Exportar lançamentos</button>':''}</div><div class="panelbody">${explorerMain()}</div></div><div class="grid2 equal"><div class="panel"><div class="panelhead"><div><h2>Detalhe do recorte</h2><p>Resumo do segmento selecionado</p></div></div><div class="panelbody">${renderMiniStats(rows)}</div></div><div class="panel"><div class="panelhead"><div><h2>Como ler os valores</h2></div></div><div class="panelbody minor">Despesas são mostradas como valores positivos de consumo, descontando eventuais estornos. O valor líquido conserva a lógica da DRE. Use a visualização por CR para comparar atividades e áreas de gestão, lembrando que custos indiretos podem estar distribuídos em outros centros.</div></div></div>`;}
function renderMiniStats(rows){let t=sum(rows,'amount');let m=new Set(rows.map(r=>r.month)),n=new Set(rows.map(r=>r.account)),u=new Set(rows.map(r=>r.cr));return `<div class="metricrow"><div class="metricitem"><small>Valor líquido</small><strong>${money0(t)}</strong></div><div class="metricitem"><small>Contas</small><strong>${INT.format(n.size)}</strong></div><div class="metricitem"><small>Centros de resultado</small><strong>${INT.format(u.size)}</strong></div></div>`;}
function pageCenters(){let rows=actuals(),groups=new Map();for(let r of rows){const key=r.unit+'|'+r.crCode+'|'+r.cr;let x=groups.get(key)||{unit:r.unit,cr:r.cr,crCode:r.crCode,revenue:0,expense:0,count:0};x[r.type]+=r.amount;x.count++;groups.set(key,x);}let list=[...groups.values()].map(x=>({...x,result:x.revenue-x.expense})).sort((a,b)=>b.expense-a.expense);let top=list.slice(0,12);return `<div class="panel"><div class="panelhead"><div><h2>Centros de resultado</h2><p>Receitas, despesas e resultado contábil identificado em cada atividade ou centro</p></div><button class="btn small" data-action="centerToExplorer">Análise detalhada por CR →</button></div><div class="panelbody"><div class="notice">Os valores por CR representam os lançamentos associados ao centro. Não equivalem necessariamente à margem final: despesas indiretas podem estar lançadas em outros centros, e investimentos são excluídos.</div><div class="tablewrap"><table class="datatable"><thead><tr><th>Unidade</th><th>Centro de resultado</th><th class="num">Receitas</th><th class="num">Despesas</th><th class="num">Saldo identificado</th><th class="num">Mov.</th></tr></thead><tbody>${list.map(x=>`<tr><td>${esc(unitTitle(x.unit))}</td><td class="wrap">${esc(x.cr)} <span class="minor">${esc(x.crCode)}</span></td><td class="num">${money0(x.revenue)}</td><td class="num">${money0(x.expense)}</td><td class="num ${signClass(x.result)}">${money0(x.result)}</td><td class="num">${INT.format(x.count)}</td></tr>`).join('')}</tbody></table></div><div class="statline"><span>${INT.format(list.length)} centro(s) de resultado no período</span><span>Selecione um CR no explorador para consultar os lançamentos</span></div></div></div><div class="panel"><div class="panelhead"><div><h2>Maiores despesas por centro</h2></div></div><div class="panelbody">${renderBars(top.map(x=>({name:unitTitle(x.unit)+' · '+x.cr,amount:x.expense})),12)}</div></div>`;}
function pageOpportunities(){let exp=actuals().filter(r=>r.type==='expense');let byAccount=groupRows(exp,'account'),total=sum(exp,'amount');let top=byAccount.slice(0,10),top5=sum(top.slice(0,5),'amount');let monthlyExpenses=monthly();let deviations=[];for(let r of monthlyExpenses){if(!r.fullActual||r.goalE===null)continue;deviations.push({name:MONTHS[r.month-1]+' / '+state.year,amount:r.expense-r.goalE,real:r.expense,meta:r.goalE});}deviations=deviations.filter(x=>x.amount>0).sort((a,b)=>b.amount-a.amount);
 let mo=state.rows.filter(r=>r.isDre&&r.type==='expense'&&r.year===state.year&&unitsSelected().includes(r.unit));let maxM=Math.min(12,state.end);let spikes=[];let mm=new Map();for(let r of mo){let k=r.account+'|'+r.unit;let a=mm.get(k)||Array(12).fill(0);a[r.month-1]+=r.amount;mm.set(k,a);}for(let [k,a] of mm){let now=a[maxM-1]||0,older=a.slice(Math.max(0,maxM-4),maxM-1),avg=older.length?older.reduce((x,y)=>x+y,0)/older.length:0;if(older.length===3&&now>avg*1.65&&now-avg>1500&&now>2500){spikes.push({name:k.split('|')[0],unit:k.split('|')[1],current:now,prev:avg,amount:now-avg});}}spikes.sort((a,b)=>b.amount-a.amount);
 return `<div class="grid2 equal"><div class="panel"><div class="panelhead"><div><h2>Concentração de despesas</h2><p>Dez contas com os maiores custos líquidos</p></div></div><div class="panelbody"><div class="metricitem" style="margin-bottom:15px"><small>Participação das 5 maiores contas</small><strong>${pct(total!==0?top5/total:null)}</strong></div>${renderBars(top,10)}</div></div><div class="panel"><div class="panelhead"><div><h2>Meses acima da meta de despesas</h2><p>Excesso de despesas consolidado em relação ao planejamento</p></div></div><div class="panelbody">${deviations.length?renderBars(deviations,12,null,'red'):emptyMsg('Sem estouros de meta identificados','Ou não existem metas e realizado suficientes para comparação.')}</div></div></div>
 <div class="panel"><div class="panelhead"><div><h2>Variações atípicas para investigação</h2><p>Último mês do filtro versus média dos três meses anteriores por conta e unidade</p></div><span class="pill">Critério exploratório</span></div><div class="panelbody">${spikes.length?`<div class="tablewrap"><table class="datatable"><thead><tr><th>Conta</th><th>Unidade</th><th class="num">Média 3 meses</th><th class="num">Último mês</th><th class="num">Variação</th></tr></thead><tbody>${spikes.slice(0,18).map(x=>`<tr><td class="wrap">${esc(x.name)}</td><td>${esc(unitTitle(x.unit))}</td><td class="num">${money0(x.prev)}</td><td class="num">${money0(x.current)}</td><td class="num badText">+${money0(x.amount)}</td></tr>`).join('')}</tbody></table></div>`:emptyMsg('Nenhuma variação atende ao critério','São necessários quatro meses consecutivos e movimentação suficiente para comparação.')}<p class="infofooter">Aumento isolado não comprova desperdício: pode refletir sazonalidade, apropriações contábeis, pagamentos concentrados ou mudança de demanda. Critério: aumento superior a 65%, diferença acima de R$ 1.500 e último mês acima de R$ 2.500.</p></div></div>
 <div class="panel"><div class="panelhead"><div><h2>Roteiro sugerido de investigação</h2><p>Ações para transformar o diagnóstico em oportunidades de melhoria</p></div></div><div class="panelbody"><div class="opgrid"><div class="opcard"><div class="ophead"><span class="ranknum">01</span><h3>Revisar as maiores contas</h3></div><p>Investigar histórico e CR das contas mais representativas. Procurar contratos recorrentes, gastos concentrados e custos evitáveis.</p></div><div class="opcard"><div class="ophead"><span class="ranknum">02</span><h3>Explicar os meses atípicos</h3></div><p>Confirmar se a variação decorre de evento pontual, competência contábil, mudança de demanda ou elevação recorrente.</p></div><div class="opcard"><div class="ophead"><span class="ranknum">03</span><h3>Estimar economia verificável</h3></div><p>Usar valores dos lançamentos como referência; só registrar potencial de economia após identificar uma ação concreta e viável.</p></div></div></div></div>`;}
function pageOffDre(){let outside=state.rows.filter(r=>isInPeriod(r)&&r.extra);let investment=outside.filter(r=>r.isInvest),projects=outside.filter(r=>!r.isInvest);let chosen=state.offmode==='invest'?investment:projects;let groups=groupRows(chosen,'group');let records=chosen.slice(0,300);return `<div class="notice">Esta área é totalmente separada da DRE. Somente valores da coluna específica da DRE são utilizados nos indicadores de receitas, despesas, resultado e comparação com metas. Há lançamentos de materiais, serviços e outras contas excluídos da DRE que não devem ser classificados automaticamente como investimentos.</div><div class="kpis"><div class="kpi blue"><div class="klabel">Investimentos identificados</div><div class="kvalue">${money0(sum(investment,'offamount'))}</div><div class="ksub">Grupo contábil Investimentos</div></div><div class="kpi"><div class="klabel">Demais valores fora da DRE</div><div class="kvalue">${money0(sum(projects,'offamount'))}</div><div class="ksub">Projetos e outras exclusões</div></div><div class="kpi purple"><div class="klabel">Lançamentos excluídos</div><div class="kvalue">${INT.format(outside.length)}</div><div class="ksub">Com realizado diferente de zero</div></div><div class="kpi red"><div class="klabel">Impacto sobre a DRE</div><div class="kvalue">R$ 0,00</div><div class="ksub">Excluídos do cálculo principal</div></div></div>
 <div class="panel"><div class="panelhead"><div><h2>Movimentações não integrantes da DRE</h2><p>Consulta dos valores registrados fora da DRE</p></div><button class="btn small" data-action="csvOff">Exportar recorte</button></div><div class="toolbar"><div class="segmented"><button data-action="offmode" data-value="invest" class="${state.offmode==='invest'?'active':''}">Investimentos</button><button data-action="offmode" data-value="projects" class="${state.offmode==='projects'?'active':''}">Projetos / outras exclusões</button></div></div><div class="panelbody"><div class="sectionlabel">Composição por grupo</div>${renderBars(groups,9)}<div class="sectionlabel">Lançamentos (até 300 na tela; exportação completa)</div><div class="tablewrap"><table class="datatable"><thead><tr><th>Competência</th><th>Unidade</th><th>Grupo</th><th>Conta</th><th>Histórico</th><th class="num">Valor fora DRE</th></tr></thead><tbody>${records.map(r=>`<tr><td>${M[r.month-1]}/${r.year}</td><td>${esc(unitTitle(r.unit))}</td><td>${esc(r.group)}</td><td>${esc(r.account)}</td><td class="wrap">${esc(r.history)}</td><td class="num">${money(r.offamount)}</td></tr>`).join('')}</tbody></table></div>${!records.length?emptyMsg('Nenhum registro','Não foram encontradas movimentações fora da DRE no recorte.'):''}<div class="infofooter">Investimentos: classificação baseada no grupo contábil “Investimentos”. Os demais valores excluídos são tratados separadamente e podem requerer validação financeira.</div></div></div>`;}
function pageData(){let list=SOURCES.map(x=>({source:x,status:state.health[x.id]||'pending',count:state.rawCounts[x.id]}));let valid=state.rows.filter(r=>r.isDre),out=state.rows.filter(r=>r.extra);let ys=availableYears();return `<div class="grid2 equal"><div class="panel"><div class="panelhead"><div><h2>Fontes de dados</h2><p>Leitura online a cada abertura ou atualização manual</p></div><button class="btn primary small" data-action="refresh" ${state.loading?'disabled':''}>Atualizar fontes</button></div><div class="panelbody">${list.map(x=>`<div class="datarow"><div><strong>${esc(x.source.label)}</strong><div><small>${x.count!==undefined?INT.format(x.count)+' linhas na fonte':'Nenhuma leitura concluída'}</small></div></div><div class="summarystrip"><span class="pill ${x.status==='ok'?'ok':x.status==='err'?'danger':'warn'}">${x.status==='ok'?'Conectada':x.status==='err'?'Falha':x.status==='loading'?'Carregando':'Pendente'}</span><a class="btn small" target="_blank" rel="noopener noreferrer" href="${esc(x.source.url)}">CSV ↗</a></div></div>`).join('')}</div></div><div class="panel"><div class="panelhead"><div><h2>Verificações</h2><p>Resumo de consistência após a leitura</p></div></div><div class="panelbody"><div class="metricrow"><div class="metricitem"><small>Lançamentos da DRE</small><strong>${INT.format(valid.length)}</strong></div><div class="metricitem"><small>Fora da DRE</small><strong>${INT.format(out.length)}</strong></div><div class="metricitem"><small>Anos</small><strong>${ys.length}</strong></div></div><div class="datarow"><div><strong>Metas cadastradas</strong><div><small>Unidade × mês × ano</small></div></div><strong>${INT.format(state.goals.size)}</strong></div><div class="datarow"><div><strong>Última consulta</strong></div><strong>${state.updated?state.updated.toLocaleString('pt-BR'):'—'}</strong></div></div></div></div><div class="panel"><div class="panelhead"><div><h2>Política de tratamento</h2><p>Parâmetros contábeis utilizados pela aplicação</p></div></div><div class="panelbody"><div class="opgrid"><div class="opcard"><h3>Realizado da DRE</h3><p>Somente a coluna “Valor Realizado (DRE ...)” é utilizada nos resultados. Despesas passam a ser exibidas como consumo positivo, mantendo os estornos.</p></div><div class="opcard"><h3>Investimentos e projetos</h3><p>Movimentos fora da DRE não entram no resultado. Apenas contas do grupo “Investimentos” são classificadas como investimento confirmado por grupo.</p></div><div class="opcard"><h3>Metas anuais</h3><p>As metas são independentes do realizado e cadastradas mensalmente por unidade. Não há orçamento por conta ou grupo.</p></div></div><p class="infofooter"><strong>Privacidade:</strong> os CSVs estão publicados por link e podem conter históricos identificáveis. Revise as permissões de publicação conforme a política institucional. Esta página não envia os dados a servidores adicionais, mas qualquer pessoa com acesso ao CSV público poderá consultá-lo.</p></div></div>`;}
const views={overview:['Visão executiva','Receitas, despesas e desempenho consolidado'],targets:['Metas e desempenho','Planejado x realizado com análise mensal'],explore:['Análise detalhada','Exploração dos grupos, contas, centros e lançamentos'],centers:['Centros de resultado','Composição de receitas e despesas por atividade'],opportunities:['Oportunidades','Sinais para investigação e otimização financeira'],offdre:['Fora da DRE','Investimentos e demais movimentos excluídos'],data:['Fontes e regras','Estado das conexões e validações dos dados']};

function renderShell(content){let [title,subtitle]=views[state.page];let opts=availableYears();if(!opts.length)opts=[new Date().getFullYear()];let side=`<aside class="sidebar"><div class="brand"><div class="brandline"><span class="brandmark">IF</span><div><h1>Inteligência<br>Financeira</h1><p>ANÁLISE GERENCIAL · DRE</p></div></div></div><div class="navcaption">Navegação</div><nav class="nav">${Object.entries(views).map(([key,[label]])=>`<button data-go="${key}" class="${key===state.page?'active':''}" aria-current="${key===state.page?'page':'false'}">${navIcon(key)}${esc(label)}</button>`).join('')}</nav><div class="sidebottom"><div class="navcaption" style="padding:0 0 8px">Conexões</div>${SOURCES.map(s=>`<div class="sourcerow">${esc(s.label)} <span class="dot ${state.health[s.id]||''}" title="${esc(state.health[s.id]||'Pendente')}"></span></div>`).join('')}<div class="sidehint">Dados diretamente do Google Sheets · ${state.updated?'Consulta: '+state.updated.toLocaleTimeString('pt-BR'):'Aguardando leitura'}</div></div></aside>`;
 let partialYear=state.year===new Date().getFullYear()&&state.end>=new Date().getMonth()+1;

 if(!state.loading&&state.ready&&!state.rows.length)alerts+=`<div class="notice error">Nenhuma fonte de realizado foi carregada. Abra “Fontes e regras” para verificar as conexões. Se o navegador bloquear os CSVs, a aplicação tentará uma consulta alternativa ao Google Sheets automaticamente.</div>`;
 if(state.rows.length&&!actualCoverage().complete&&state.page!=='data')alerts+=`<div class="notice">O realizado não cobre todas as unidades e competências selecionadas. Totais disponíveis são parciais; desvios consolidados frente à meta estão suspensos até haver dados completos.</div>`;
 if(partialYear&&state.page!=='data')alerts+=`<div class="notice">O período selecionado inclui o mês atual (${MONTHS[new Date().getMonth()]}). Os dados realizados podem estar incompletos; compare as metas mensais apenas após o fechamento contábil.</div>`;
 let controls=`<div class="filtbar"><div class="filter unit"><label>Unidade</label><select data-filter="unit">${UNITS.map(([id,label])=>`<option value="${id}" ${state.unit===id?'selected':''}>${esc(label)}</option>`).join('')}</select></div><div class="filter"><label>Ano</label><select data-filter="year">${opts.map(y=>`<option value="${y}" ${state.year===y?'selected':''}>${y}</option>`).join('')}</select></div><div class="filter"><label>De</label><select data-filter="start">${MONTHS.map((m,i)=>`<option value="${i+1}" ${state.start===i+1?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div class="filter"><label>Até</label><select data-filter="end">${MONTHS.map((m,i)=>`<option value="${i+1}" ${state.end===i+1?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div class="filterbadge">${esc(rangeLabel())}</div></div>`;
 el.innerHTML=`<div class="layout">${side}<main class="main"><header class="mast"><div><div class="eyebrow">GESTÃO · PERFORMANCE FINANCEIRA</div><h1 class="pagetitle">${esc(title)}</h1><div class="subtitle">${esc(subtitle)}</div></div><div class="mast-actions"><div class="lastupdate">${state.updated?'Atualizado em '+state.updated.toLocaleString('pt-BR'):'Consulta não realizada'}<br>Fontes CSV publicadas</div><button class="btn primary" data-action="refresh" ${state.loading?'disabled':''}>${state.loading?'Consultando...':'↻ Atualizar dados'}</button></div></header>${controls}${alerts}${content}${state.loading&&state.ready?'<div class="loadingbar"></div>':''}<footer class="foot">Painel gerencial · Elaborado a partir das fontes contábeis publicadas · Valores em reais (BRL)</footer></main></div>`;}
function render(){if(state.loading&&!state.ready){renderShell(`<div class="panel"><div class="loadingcenter"><div><div class="spinner"></div><strong>Consultando as fontes financeiras</strong><p class="minor">Buscando realizado SENAI, SESI e metas mensais...</p></div></div></div>`);return;}let content=({'overview':pageOverview,'targets':pageTargets,'explore':pageExplore,'centers':pageCenters,'opportunities':pageOpportunities,'offdre':pageOffDre,'data':pageData}[state.page]||pageOverview)();renderShell(content);}
function rowsCsv(data,filename){let body=data.map(r=>r.map(v=>String(v??'').replace(/\r?\n/g,' '))).map(r=>r.map(s=>'"'+s.replace(/"/g,'""')+'"').join(';')).join('\r\n');let blob=new Blob(['\ufeff'+body],{type:'text/csv;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),5000);}
function exportRecords(off=false){let records=off?state.rows.filter(r=>isInPeriod(r)&&r.extra&&(state.offmode==='invest'?r.isInvest:!r.isInvest)):explorerRows().filter(r=>norm(state.search)===''||[r.history,r.account,r.cr,r.group,r.code,r.id].some(x=>norm(x).includes(norm(state.search))));let head=['Unidade','Ano','Mês','Tipo','Grupo','CodConta','NomeConta','CodCR','NomeCR','Histórico','IdLancamento','CentroCusto','Valor realizado (origem)','Valor DRE (origem)','Valor gerencial'];let body=records.map(r=>[unitTitle(r.unit),r.year,M[r.month-1],r.type==='expense'?'Despesas':'Receitas',r.group,r.code,r.account,r.crCode,r.cr,r.history,r.id,r.cost,r.orig,r.dre,off?r.offamount:r.amount]);rowsCsv([head,...body],(off?'fora_dre_':'lancamentos_dre_')+state.year+'.csv');}
function exportMonths(){let head=['Mês','Ano','Receita meta','Receita realizada','Desvio receita','Despesa meta','Despesa realizada','Excesso despesa','Resultado realizado'];let a=monthly();rowsCsv([head,...a.map(r=>[M[r.month-1],state.year,r.goalR,r.hasActual?r.revenue:'',r.hasActual&&r.goalR!==null?r.revenue-r.goalR:'',r.goalE,r.hasActual?r.expense:'',r.hasActual&&r.goalE!==null?r.expense-r.goalE:'',r.hasActual?r.result:''])],'metas_realizado_'+state.year+'.csv');}
function setPage(p){if(!views[p])return;state.page=p;state.search='';state.pageno=0;window.scrollTo({top:0,behavior:'instant'});render();}
let searchTimer;
document.addEventListener('click',e=>{let btn=e.target.closest('[data-go],[data-action]');if(!btn)return;if(btn.dataset.go){setPage(btn.dataset.go);return;}let a=btn.dataset.action;switch(a){case 'refresh':refresh();break;case 'exploreType':state.exploreType=btn.dataset.value;state.drill={group:null,account:null,cr:null};state.search='';state.pageno=0;render();break;case 'exploreMode':state.exploreMode=btn.dataset.value;state.drill={group:null,account:null,cr:null};state.search='';state.pageno=0;render();break;case 'resetDrill':state.drill={group:null,account:null,cr:null};state.search='';state.pageno=0;render();break;case 'chooseDrill':state.drill[btn.dataset.field]=btn.dataset.key;state.search='';state.pageno=0;render();break;case 'crumb':{let idx=Number(btn.dataset.index);let order=state.exploreMode==='group'?['group','account','cr']:['cr','group','account'];for(let j=idx+1;j<order.length;j++)state.drill[order[j]]=null;state.search='';state.pageno=0;render();break;}case 'focusGroup':state.page='explore';state.exploreMode='group';state.exploreType='expense';state.drill={group:btn.dataset.key,account:null,cr:null};state.search='';render();break;case 'focusRevenue':state.page='explore';state.exploreMode='group';state.exploreType='revenue';state.drill={group:btn.dataset.key,account:null,cr:null};state.search='';render();break;case 'centerToExplorer':state.page='explore';state.exploreMode='cr';state.drill={group:null,account:null,cr:null};render();break;case 'pageBack':state.pageno=Math.max(0,state.pageno-1);render();break;case 'pageNext':state.pageno++;render();break;case 'offmode':state.offmode=btn.dataset.value;render();break;case 'csvRecords':exportRecords(false);break;case 'csvOff':exportRecords(true);break;case 'csvMonth':exportMonths();break;}});
document.addEventListener('change',e=>{const n=e.target;if(n.dataset.filter){let k=n.dataset.filter;state[k]=k==='year'||k==='start'||k==='end'?Number(n.value):n.value;if(k==='year'){state.end=defaultEnd(state.year);state.start=1;}if(state.start>state.end){if(k==='start')state.end=state.start;else state.start=state.end;}state.search='';state.pageno=0;state.drill={group:null,account:null,cr:null};render();}if(n.dataset.control==='metric'){state.metric=n.value;render();}});
document.addEventListener('input',e=>{if(e.target.dataset.control==='search'){clearTimeout(searchTimer);state.search=e.target.value;state.pageno=0;let pos=e.target.selectionStart;searchTimer=setTimeout(()=>{render();let input=document.querySelector('[data-control="search"]');if(input){input.focus();try{input.setSelectionRange(pos,pos);}catch(e){}}},320);}});
render();refresh();
</script>
</body>
</html>
