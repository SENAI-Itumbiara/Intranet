<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio de Cursos - SENAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-dark: #003366; /* Azul Marinho Principal */
            --primary-medium: #0056b3; /* Azul Destaque */
            --primary-light: #e6f0fa; /* Azul Claro/Pastel para fundos */
            --text-main: #1e293b; /* Cinza Escuro para leitura confortável */
            --text-muted: #64748b; /* Cinza Secundário */
            --white: #ffffff;
            --background: #f8fafc;
            --shadow-subtle: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.5;
            padding-bottom: 60px;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary-dark) 0%, #002244 100%);
            color: var(--white);
            padding: 40px 20px;
            text-align: center;
            box-shadow: var(--shadow-subtle);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.05em;
        }

        header p {
            font-size: 1.1rem;
            color: #93c5fd;
            font-weight: 400;
        }

        /* Container Principal */
        main {
            max-width: 1200px;
            margin: -30px auto 0 auto;
            padding: 0 20px;
        }

        /* Seção de Filtros */
        .filter-section {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow-md);
            margin-bottom: 32px;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-medium);
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.15);
        }

        .search-box svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 20px;
            height: 20px;
        }

        .filter-group {
            margin-bottom: 16px;
        }

        .filter-label {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-tag {
            background-color: var(--background);
            border: 1px solid #e2e8f0;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .filter-tag:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .filter-tag.active {
            background-color: var(--primary-medium);
            border-color: var(--primary-medium);
            color: var(--white);
        }

        /* Contador de Resultados */
        .results-counter {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-weight: 500;
        }

        .results-counter span {
            color: var(--primary-dark);
            font-weight: 700;
        }

        /* Grid de Cursos */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* Card de Curso */
        .course-card {
            background: var(--white);
            border-radius: var(--radius);
            border: 1px solid #e2e8f0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-subtle);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .course-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 20px -8px rgb(0 0 0 / 0.1);
        }

        .card-header {
            margin-bottom: 16px;
        }

        .badge-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-area {
            background-color: var(--primary-light);
            color: var(--primary-dark);
        }

        .badge-modalidade {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .course-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary-dark);
            line-height: 1.3;
        }

        .card-body {
            margin-bottom: 20px;
        }

        .duration-info {
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            color: var(--text-main);
            font-weight: 500;
            background: var(--background);
            padding: 8px 12px;
            border-radius: 6px;
            width: fit-content;
        }

        .duration-info svg {
            width: 16px;
            height: 16px;
            margin-right: 6px;
            color: var(--primary-medium);
        }

        .card-footer {
            margin-top: auto;
        }

        .btn-details {
            width: 100%;
            background-color: var(--white);
            border: 1.5px solid var(--primary-medium);
            color: var(--primary-medium);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-details:hover {
            background-color: var(--primary-medium);
            color: var(--white);
        }

        /* Modal (Conteúdo Programático) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            background: var(--white);
            border-radius: var(--radius);
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-md);
            transform: scale(0.95);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal-container {
            transform: scale(1);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .modal-title-group h3 {
            font-size: 1.3rem;
            color: var(--primary-dark);
            margin-bottom: 6px;
        }

        .btn-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            transition: background-color 0.2s;
        }

        .btn-close:hover {
            background-color: #f1f5f9;
            color: var(--text-main);
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
        }

        .content-list {
            list-style: none;
        }

        .content-list li {
            position: relative;
            padding-left: 24px;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .content-list li::before {
            content: "";
            position: absolute;
            left: 6px;
            top: 10px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--primary-medium);
        }

        /* Estado Vazio */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 48px 24px;
            background: var(--white);
            border-radius: var(--radius);
            border: 1px dashed #cbd5e1;
            color: var(--text-muted);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            header h1 { font-size: 1.8rem; }
            .filter-section { padding: 16px; }
            .courses-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

            const areas = ['all', ...new Set(coursesData.map(c => c.Área))];

            // Renderiza Filtros de Área
            areaFiltersContainer.innerHTML = areas.map(area => `

                </button>

            if (filteredCourses.length === 0) {
                coursesGrid.innerHTML = `
                    <div class="empty-state">
                        <h3>Nenhum curso encontrado</h3>
                        <p>Tente ajustar os termos de busca ou remover os filtros selecionados.</p>
                    </div>
                `;
                return;
            }

            // Constrói os Cards
            coursesGrid.innerHTML = filteredCourses.map((course, index) => `
                <div class="course-card">
                    <div class="card-header">
                        <div class="badge-group">
                            <span class="badge badge-area">${course.Área}</span>
                            <span class="badge badge-modalidade">${course.Modalidade}</span>
                        </div>
                        <h2 class="course-title">${course.Curso}</h2>
                    </div>
                    <div class="card-body">
                        <div class="duration-info">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>
                            Duração: ${course.CH}h
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn-details" onclick="openDetailsModal(${JSON.stringify(course).replace(/"/g, '&quot;')})">
                            <span>Ver Conteúdo Comercial</span>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width: 16px; height: 16px;">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
                            </svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Configuração dos Ouvintes de Eventos (Interações)
        function setupEventListeners() {
            // Busca por input em tempo real
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderCourses();
            });

            // Cliques em tags de Área
            areaFiltersContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-tag')) {
                    areaFiltersContainer.querySelectorAll('.filter-tag').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    activeArea = e.target.getAttribute('data-filter');
                    renderCourses();
                }
            });

            // Cliques em tags de Modalidade
            modalidadeFiltersContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('filter-tag')) {
                    modalidadeFiltersContainer.querySelectorAll('.filter-tag').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    activeModalidade = e.target.getAttribute('data-filter');
                    renderCourses();
                }
            });

            // Fechamento do Modal
            btnCloseModal.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });
        }

        // Abre o modal traduzindo as quebras de linha em listas limpas para o Marketing
        function openDetailsModal(course) {
            modalCourseTitle.textContent = course.Curso;
            
            modalBadgeGroup.innerHTML = `
                <span class="badge badge-area">${course.Área}</span>
                <span class="badge badge-modalidade">${course.Modalidade}</span>
                <span class="badge" style="background-color: #f1f5f9; color: var(--primary-dark)">Duração: ${course.CH}h</span>
            `;

            // Tratamento do conteúdo estruturado \n -> Bullet Points
            const topics = course["Conteúdo Programático"].split('\n').filter(t => t.trim() !== '');
            modalContentList.innerHTML = topics.map(topic => `<li>${topic}</li>`).join('');

            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden'; // Evita scroll de fundo
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }
    </script>
</body>
</html>
