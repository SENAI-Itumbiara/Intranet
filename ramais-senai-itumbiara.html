<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramais — SENAI Itumbiara</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --blue-900:#0a3a66;
    --blue-700:#0f5ba0;
    --blue-600:#1372c2;
    --blue-100:#e8f1fa;
    --blue-50:#f4f9fd;
    --gray-100:#f5f6f8;
    --gray-200:#e7e9ec;
    --gray-400:#aeb4bd;
    --gray-600:#6b7280;
    --gray-800:#2b2f36;
    --white:#ffffff;
    --shadow:0 2px 10px rgba(10,58,102,0.08);
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    background:var(--gray-100);
    color:var(--gray-800);
  }
  header{
    background:linear-gradient(135deg, var(--blue-900), var(--blue-600));
    color:var(--white);
    padding:28px 24px 60px;
    text-align:center;
    position:relative;
  }
  header h1{
    margin:0 0 4px;
    font-size:1.6rem;
    font-weight:700;
    letter-spacing:.3px;
  }
  header p{
    margin:0;
    opacity:.9;
    font-size:.92rem;
  }
  .container{
    max-width:1100px;
    margin:-40px auto 40px;
    padding:0 20px;
  }
  .panel{
    background:var(--white);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:20px;
    margin-bottom:20px;
  }
  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
  }
  .field{
    flex:1 1 220px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field label{
    font-size:.78rem;
    font-weight:600;
    color:var(--blue-700);
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  input[type="text"], select{
    border:1px solid var(--gray-200);
    border-radius:8px;
    padding:10px 12px;
    font-size:.95rem;
    background:var(--gray-50,#fff);
    color:var(--gray-800);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input[type="text"]:focus, select:focus{
    border-color:var(--blue-600);
    box-shadow:0 0 0 3px var(--blue-100);
  }
  .actions{
    display:flex;
    align-items:flex-end;
  }
  button#clearBtn{
    border:1px solid var(--gray-200);
    background:var(--white);
    color:var(--blue-700);
    border-radius:8px;
    padding:10px 16px;
    font-size:.9rem;
    font-weight:600;
    cursor:pointer;
    transition:background .15s;
  }
  button#clearBtn:hover{
    background:var(--blue-50);
  }
  .meta-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:.85rem;
    color:var(--gray-600);
  }
  .meta-row span#count{
    font-weight:700;
    color:var(--blue-700);
  }
  .table-wrap{
    overflow-x:auto;
    border-radius:var(--radius);
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:.92rem;
    min-width:560px;
  }
  thead th{
    background:var(--blue-900);
    color:var(--white);
    text-align:left;
    padding:12px 14px;
    font-weight:600;
    position:sticky;
    top:0;
    white-space:nowrap;
  }
  tbody tr{
    border-bottom:1px solid var(--gray-200);
    transition:background .12s;
  }
  tbody tr:hover{
    background:var(--blue-50);
  }
  tbody td{
    padding:11px 14px;
    vertical-align:top;
  }
  td.local{
    font-weight:600;
    color:var(--blue-700);
    white-space:nowrap;
  }
  td.setor{
    color:var(--gray-800);
  }
  td.pessoa{
    font-weight:500;
  }
  td.ramal{
    white-space:nowrap;
    color:var(--gray-800);
  }
  .badge{
    display:inline-block;
    background:var(--blue-100);
    color:var(--blue-700);
    font-size:.75rem;
    font-weight:600;
    padding:2px 8px;
    border-radius:20px;
    margin-right:4px;
  }
  .empty, .loading, .error{
    text-align:center;
    padding:40px 20px;
    color:var(--gray-600);
  }
  .error{
    color:#b3261e;
  }
  .spinner{
    width:32px;height:32px;
    border:3px solid var(--blue-100);
    border-top-color:var(--blue-600);
    border-radius:50%;
    margin:0 auto 12px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  footer{
    text-align:center;
    color:var(--gray-400);
    font-size:.78rem;
    padding:20px;
  }
  @media (max-width:600px){
    header h1{font-size:1.3rem;}
    .filters{flex-direction:column;}
    .actions{justify-content:flex-end;}
  }
</style>
</head>
<body>

<header>
  <h1>📞 Ramais — SENAI Itumbiara</h1>
  <p>Consulta de contatos por local, setor e pessoa</p>
</header>

<div class="container">

  <div class="panel">
    <div class="filters">
      <div class="field">
        <label for="searchInput">Buscar (Pessoa / Setor / Local / Ramal)</label>
        <input type="text" id="searchInput" placeholder="Digite para buscar...">
      </div>
      <div class="field">
        <label for="localSelect">Local</label>
        <select id="localSelect"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label for="setorSelect">Setor</label>
        <select id="setorSelect"><option value="">Todos</option></select>
      </div>
      <div class="actions">
        <button id="clearBtn">Limpar filtros</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="meta-row">
      <div>Exibindo <span id="count">0</span> registro(s)</div>
      <div id="updatedAt"></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Local</th>
            <th>Setor</th>
            <th>Pessoa</th>
            <th>Ramal</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="4">
            <div class="loading">
              <div class="spinner"></div>
              Carregando dados...
            </div>
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<footer>Dados carregados em tempo real de planilha do Google Sheets · SENAI Itumbiara</footer>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ_3Jp1G9ta8bexZIjEi5RW2apFfV-Ot9h3CjPETHvYVBeSjrKPGMWlbbx3cZKjc_5FLzTyW5rr6tiq/pub?output=csv";

  let allData = [];

  const tableBody = document.getElementById('tableBody');
  const searchInput = document.getElementById('searchInput');
  const localSelect = document.getElementById('localSelect');
  const setorSelect = document.getElementById('setorSelect');
  const clearBtn = document.getElementById('clearBtn');
  const countEl = document.getElementById('count');
  const updatedAtEl = document.getElementById('updatedAt');

  function normalize(str){
    return (str || '').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function populateSelect(select, values){
    const sorted = [...new Set(values)].filter(Boolean).sort((a,b)=>a.localeCompare(b,'pt-BR'));
    select.innerHTML = '<option value="">Todos</option>' +
      sorted.map(v => `<option value="${v.replace(/"/g,'&quot;')}">${v}</option>`).join('');
  }

  function render(){
    const term = normalize(searchInput.value);
    const local = localSelect.value;
    const setor = setorSelect.value;

    const filtered = allData.filter(row => {
      if(local && row.Local !== local) return false;
      if(setor && row.Setor !== setor) return false;
      if(term){
        const haystack = normalize(`${row.Local} ${row.Setor} ${row.Pessoa} ${row.Ramal}`);
        if(!haystack.includes(term)) return false;
      }
      return true;
    });

    countEl.textContent = filtered.length;

    if(filtered.length === 0){
      tableBody.innerHTML = `<tr><td colspan="4"><div class="empty">Nenhum resultado encontrado para os filtros aplicados.</div></td></tr>`;
      return;
    }

    tableBody.innerHTML = filtered.map(row => `
      <tr>
        <td class="local"><span class="badge">${row.Local || '-'}</span></td>
        <td class="setor">${row.Setor || '-'}</td>
        <td class="pessoa">${row.Pessoa || '-'}</td>
        <td class="ramal">${row.Ramal || '-'}</td>
      </tr>
    `).join('');
  }

  function clearFilters(){
    searchInput.value = '';
    localSelect.value = '';
    setorSelect.value = '';
    render();
  }

  searchInput.addEventListener('input', render);
  localSelect.addEventListener('change', render);
  setorSelect.addEventListener('change', render);
  clearBtn.addEventListener('click', clearFilters);

  fetch(CSV_URL)
    .then(res => {
      if(!res.ok) throw new Error('Falha ao carregar a planilha (HTTP ' + res.status + ')');
      return res.text();
    })
    .then(csvText => {
      const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
      allData = parsed.data.map(r => ({
        Local: (r.Local || '').trim(),
        Setor: (r.Setor || '').trim(),
        Pessoa: (r.Pessoa || '').trim(),
        Ramal: (r.Ramal || '').trim()
      }));
      populateSelect(localSelect, allData.map(r => r.Local));
      populateSelect(setorSelect, allData.map(r => r.Setor));
      updatedAtEl.textContent = 'Atualizado: ' + new Date().toLocaleString('pt-BR');
      render();
    })
    .catch(err => {
      tableBody.innerHTML = `<tr><td colspan="4"><div class="error">⚠️ ${err.message}. Verifique a conexão ou se a planilha está publicada corretamente.</div></td></tr>`;
    });
</script>

</body>
</html>
