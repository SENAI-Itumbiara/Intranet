<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061b32"><meta name="description" content="Mundo SENAI Experience: descubra seu perfil e explore a tecnologia."><title>Mundo SENAI Experience</title>
<style>
:root{--bg:#061b32;--navy:#082b50;--card:#103859;--blue:#0084e6;--orange:#ff971c;--aqua:#25d9f5;--text:#f6fbff;--muted:#bad4e9;--line:#335d7b;--r:24px;font-family:Arial,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 90% 4%,#145b84 0%,transparent 42%),radial-gradient(ellipse at 0% 95%,#092e66,transparent 53%),var(--bg);color:var(--text);overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.app{max-width:1460px;margin:0 auto;min-height:100vh;padding:clamp(14px,2.1vw,30px);display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:58px}.brand{display:flex;align-items:center;gap:12px}.logo{display:inline-grid;place-items:center;min-width:90px;border-radius:10px;background:white;color:#00508b;padding:8px 14px;font-weight:900;letter-spacing:1px}.brandname{font-weight:800;font-size:clamp(14px,1.5vw,22px);letter-spacing:.06em}.eyebrow{color:var(--aqua);font-size:.8rem;text-transform:uppercase;font-weight:800;letter-spacing:.19em}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:end}.soft{border:1px solid #50708d;background:#103956;color:white;border-radius:14px;padding:12px 17px;font-weight:700}.soft:hover{background:#1a5278}main{flex:1;display:flex;flex-direction:column;justify-content:center}.hero{text-align:center;margin:clamp(16px,2vh,34px) auto 24px;max-width:1050px}.hero h1{font-size:clamp(36px,6.5vw,90px);line-height:1.02;letter-spacing:-.045em;margin:12px 0;background:linear-gradient(105deg,#fff 32%,#5ce7ff 73%,#ffc76f);color:transparent;background-clip:text}.hero p{font-size:clamp(16px,1.8vw,25px);color:#d1e7f6}.orbit{display:inline-flex;align-items:center;gap:8px;background:#0b3856;border:1px solid #245c7a;border-radius:100px;padding:8px 16px;color:#b6ecff;font-weight:700}.dot{height:9px;width:9px;border-radius:50%;background:#46f6bb;box-shadow:0 0 12px #46f6bb}.tiles{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.9vw,24px);max-width:1070px;margin:12px auto 32px}.tile{text-align:left;min-height:170px;border:1px solid #416b89;border-radius:var(--r);color:white;padding:clamp(18px,2.5vw,29px);background:linear-gradient(135deg,#135181,#092945);position:relative;overflow:hidden;transition:transform .17s ease,border-color .17s ease}.tile:hover{transform:translateY(-3px);border-color:#6beaff}.tile:active{transform:scale(.985)}.tile:nth-child(2){background:linear-gradient(135deg,#744110,#392409)}.tile:nth-child(3){background:linear-gradient(135deg,#106660,#0a303b)}.tile:nth-child(4){background:linear-gradient(135deg,#44376b,#1c274b)}.tile .bigicon{font-size:clamp(30px,3vw,48px);display:block;margin-bottom:12px}.tile h2{margin:0 0 7px;font-size:clamp(19px,2vw,29px)}.tile p{margin:0;color:#e2edf7;font-size:clamp(13px,1.25vw,18px)}.tile .arrow{position:absolute;right:22px;top:23px;font-size:24px;opacity:.85}.panel{width:min(100%,950px);margin:25px auto;background:linear-gradient(155deg,#123d60,#092641);border:1px solid #376585;border-radius:28px;padding:clamp(18px,3.7vw,46px);box-shadow:0 18px 55px #0004}.panel h2{font-size:clamp(27px,3.1vw,45px);margin:10px 0 17px}.panel p{color:#cce1ef;line-height:1.55}.back{background:none;border:0;color:#bbddf3;font-size:17px;font-weight:700;min-height:44px}.progress{display:flex;gap:8px;margin:24px 0}.progress span{flex:1;height:9px;border-radius:20px;background:#335a78}.progress span.done{background:linear-gradient(90deg,var(--blue),var(--aqua))}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:25px}.choice{border:1px solid #577d9b;background:#18496b;border-radius:17px;min-height:100px;padding:20px;text-align:left;color:white;font-weight:800;font-size:clamp(17px,1.5vw,23px)}.choice:hover{background:#21618b;border-color:var(--aqua)}.choice:active{transform:scale(.99)}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #5c819c;border-radius:100px;padding:7px 14px;color:#bfe8ff;font-size:14px}.primary{border:0;border-radius:15px;padding:17px 26px;background:linear-gradient(110deg,#ff9a22,#ffbf5e);color:#14283d;font-weight:900;font-size:18px;min-height:56px}.primary:hover{filter:brightness(1.07)}.secondary{border:1px solid #65b9e1;border-radius:15px;padding:16px 24px;background:#103c62;color:white;font-weight:800;min-height:56px}.result{text-align:center}.medal{font-size:72px;filter:drop-shadow(0 0 17px #ffa62b99)}.result h2{color:#ffe4b3}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.center{justify-content:center}.info{border:1px solid #446e89;background:#113754;border-radius:14px;padding:18px;margin:15px 0}.list{display:grid;gap:12px;margin:18px 0}.item{background:#123e5d;border:1px solid #365e7b;border-radius:15px;padding:17px}.item strong{font-size:19px}.muted{color:#c0d4e5}.footer{color:#89afc9;text-align:center;padding:12px;font-size:13px}.notice{max-width:980px;margin:0 auto 12px;text-align:center;font-size:13px;color:#b9cee0}.offline{color:#ffdc9e}.field{width:100%;background:#082943;color:#fff;border:1px solid #547b98;border-radius:12px;padding:14px;margin:7px 0 15px;min-height:52px}.small{font-size:13px;color:#bcd4e5}.leaderboard{font-size:26px;color:#ffd18a;font-weight:900}.tag{border-radius:40px;background:#0f5174;padding:7px 12px;font-size:13px}.hidden{display:none!important}@media(max-width:670px){.brandname{font-size:12px}.top{align-items:flex-start}.tiles,.choices{grid-template-columns:1fr}.tile{min-height:145px}.panel{margin:8px auto;padding:20px}.hero h1{font-size:42px}.actions .soft{padding:9px 11px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}@keyframes slide{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.appear{animation:slide .28s ease both}.spark{position:fixed;pointer-events:none;z-index:20;width:7px;height:14px;animation:fall 1.3s linear forwards}@keyframes fall{from{transform:translateY(-15px) rotate(0);opacity:1}to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style></head><body><div class="app"><header class="top"><div class="brand"><span class="logo">SENAI</span><div><div class="brandname">MUNDO SENAI <span style="color:#ffae42">EXPERIENCE</span></div><div class="eyebrow" id="unitLabel">Tecnologia que transforma</div></div></div><div class="actions"><button class="soft" id="unitBtn" title="Escolher unidade">📍 Unidade</button><button class="soft" id="soundBtn" title="Ativar ou desativar sons">🔇 Som</button><button class="soft" id="homeBtn" title="Voltar ao início">⌂ Início</button></div></header><main id="root" aria-live="polite"></main><div class="notice" id="status"></div><footer class="footer">SESI SENAI • Conhecimento, inovação e futuro • Experiência interativa</footer></div>
<script>
(()=>{'use strict';
const PUB='https://docs.google.com/spreadsheets/d/e/2PACX-1vRPczQ5sGPizx5gI0_9kIuzKbD7gazhaYB3WJz1GCWX6C_oPygg1zlK5ZtLmSfoh4JEYukRfFK5yahX/pub?single=true&output=csv&gid=';
const GIDS={CONFIG:2001,UNIDADES:2002,PERGUNTAS_PERFIL:2003,PERFIS:2004,QUIZ_TECNOLOGIA:2005,CURSOS:2006,ESTACOES:2007,PROGRAMACAO:2008,IMAGENS:2009};
const FALLBACK={CONFIG:[{chave:'nome_evento',valor:'Mundo SENAI 2026'},{chave:'titulo_inicio',valor:'O FUTURO COMEÇA AQUI'},{chave:'subtitulo_inicio',valor:'Explore, jogue e descubra novas possibilidades'},{chave:'tempo_inatividade_seg',valor:'90'},{chave:'quiz_qtd_perguntas',valor:'6'},{chave:'desafio_qtd_perguntas',valor:'5'}],UNIDADES:[{id_unidade:'ITU',nome:'SENAI Itumbiara',cidade:'Itumbiara',ativo:'SIM'},{id_unidade:'QUI',nome:'SENAI Quirinópolis',cidade:'Quirinópolis',ativo:'SIM'}],PERGUNTAS_PERFIL:[{id:'P001',pergunta:'O que mais desperta seu interesse?',alternativa_a:'Montar equipamentos',perfil_a:'AUTOMACAO',alternativa_b:'Criar aplicativos',perfil_b:'TI',alternativa_c:'Organizar processos',perfil_c:'GESTAO',alternativa_d:'Fabricar peças',perfil_d:'MECANICA',ativo:'SIM'},{id:'P002',pergunta:'Qual ambiente você gostaria de explorar?',alternativa_a:'Laboratório de robótica',perfil_a:'AUTOMACAO',alternativa_b:'Laboratório de informática',perfil_b:'TI',alternativa_c:'Centro de logística',perfil_c:'GESTAO',alternativa_d:'Oficina mecânica',perfil_d:'MECANICA',ativo:'SIM'},{id:'P003',pergunta:'Qual desafio você prefere?',alternativa_a:'Controlar uma máquina',perfil_a:'AUTOMACAO',alternativa_b:'Resolver um problema digital',perfil_b:'TI',alternativa_c:'Melhorar a produtividade',perfil_c:'GESTAO',alternativa_d:'Construir um protótipo',perfil_d:'MECANICA',ativo:'SIM'}],PERFIS:[{id_perfil:'AUTOMACAO',nome:'Automação e Eletrotécnica',descricao:'Interesse por sistemas elétricos e controle de equipamentos.',profissoes:'Técnico em Automação Industrial; Eletricista Industrial',cor:'#00c2ff',ativo:'SIM'},{id_perfil:'TI',nome:'Tecnologia da Informação',descricao:'Interesse por lógica e soluções digitais.',profissoes:'Desenvolvedor; Técnico em Informática',cor:'#8a7dff',ativo:'SIM'},{id_perfil:'GESTAO',nome:'Gestão Industrial e Logística',descricao:'Interesse por organização de recursos e processos.',profissoes:'Técnico em Logística',cor:'#2dd4bf',ativo:'SIM'},{id_perfil:'MECANICA',nome:'Mecânica e Fabricação',descricao:'Interesse por projetos e construção de produtos.',profissoes:'Técnico em Mecânica',cor:'#ffb454',ativo:'SIM'}],QUIZ_TECNOLOGIA:[{id:'Q001',categoria:'Robótica',pergunta:'Qual componente permite ao robô perceber obstáculos?',alternativa_a:'Sensor',alternativa_b:'Parafuso',alternativa_c:'Pintura',alternativa_d:'Correia',correta:'A',explicacao:'Sensores detectam obstáculos.',ativo:'SIM'},{id:'Q002',categoria:'Segurança',pergunta:'O que significa EPI?',alternativa_a:'Equipe de Produção Industrial',alternativa_b:'Equipamento de Proteção Individual',alternativa_c:'Engenharia de Produto Inteligente',alternativa_d:'Estação de Processo Integrado',correta:'B',explicacao:'O EPI auxilia na prevenção de riscos.',ativo:'SIM'}],CURSOS:[],ESTACOES:[],PROGRAMACAO:[],IMAGENS:[]};
const state={data:{},config:{},unit:'ITU',sound:false,activity:null,index:0,questions:[],scores:{},points:0,answered:[],lastResult:'',lastCode:'',cacheStatus:'',busy:false};
const $=id=>document.getElementById(id),root=$('root');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const yes=v=>String(v??'SIM').trim().toUpperCase()!=='NAO';const active=(rows)=> (rows||[]).filter(r=>yes(r.ativo));const cfg=k=>state.config[k]||'';const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function csvParse(text){text=text.replace(/^\ufeff/,'');let rows=[],row=[],field='',quote=false;for(let i=0;i<text.length;i++){let c=text[i];if(quote){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quote=false;else field+=c}else if(c==='"')quote=true;else if(c===','){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);field='';if(row.some(v=>v.trim()))rows.push(row);row=[]}else field+=c}if(row.length||field){row.push(field);rows.push(row)}let keys=(rows.shift()||[]).map(x=>x.trim());return rows.map(r=>Object.fromEntries(keys.map((k,i)=>[k,(r[i]||'').trim()])))}
async function load(){let loaded=0;const jobs=Object.entries(GIDS).map(async([name,gid])=>{let key='ms2026_'+name;try{const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),8500);let response=await fetch(PUB+gid,{signal:ctrl.signal,cache:'no-cache',redirect:'follow'});clearTimeout(tm);if(!response.ok)throw Error('HTTP '+response.status);let str=await response.text(),rows=csvParse(str);if(!rows.length||!Object.keys(rows[0]).length)throw Error('CSV vazio');state.data[name]=rows;loaded++;try{localStorage.setItem(key,JSON.stringify(rows))}catch(_){}}catch(e){try{state.data[name]=JSON.parse(localStorage.getItem(key))||FALLBACK[name]||[]}catch(_){state.data[name]=FALLBACK[name]||[]}}});await Promise.all(jobs);state.config=Object.fromEntries((state.data.CONFIG||[]).map(x=>[x.chave,x.valor]));let wanted=new URLSearchParams(location.search).get('unidade');try{state.unit=(wanted||localStorage.getItem('ms_unit')||'ITU').toUpperCase()}catch(_){state.unit=(wanted||'ITU').toUpperCase()};if(!active(state.data.UNIDADES).some(u=>u.id_unidade===state.unit))state.unit=(active(state.data.UNIDADES)[0]||{id_unidade:'ITU'}).id_unidade;state.cacheStatus=loaded===9?'Conteúdo sincronizado com Google Sheets':loaded?'Conteúdo carregado; parte dos arquivos usa cache ou demonstração':'Modo de demonstração/contingência: não foi possível acessar os CSVs';$('status').textContent=state.cacheStatus;setUnit();home()}
function setUnit(){let u=(state.data.UNIDADES||[]).find(u=>u.id_unidade===state.unit);$('unitLabel').textContent=u?u.nome:'Mundo SENAI'}
function sound(freq=540,duration=.08){if(!state.sound)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let ac=sound.ctx||(sound.ctx=new C());let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.05,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+duration)}catch(_){}}
function confetti(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<35;i++){let d=document.createElement('i');d.className='spark';d.style.left=Math.random()*100+'vw';d.style.top='-20px';d.style.background=['#ffad35','#39dffe','#fff','#52f2bd'][i%4];d.style.animationDelay=Math.random()*.35+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),1900)}}
function view(html){root.innerHTML='<div class="appear">'+html+'</div>';window.scrollTo(0,0)}function panel(html){view('<div class="panel"><button class="back" data-act="home">← Voltar ao início</button>'+html+'</div>')}
function home(){state.activity=null;let logo=(state.data.IMAGENS||[]).find(x=>x.id_imagem==='LOGO'&&x.url);view(`<section class="hero"><div class="orbit"><span class="dot"></span> UMA JORNADA PELO FUTURO</div><h1>${esc(cfg('titulo_inicio')||'O FUTURO COMEÇA AQUI')}</h1><p>${esc(cfg('subtitulo_inicio')||'Explore, jogue e descubra novas possibilidades')}</p></section><section class="tiles"><button class="tile" data-act="perfil"><span class="arrow">↗</span><span class="bigicon">🧭</span><h2>Descubra seu perfil</h2><p>Qual área da indústria combina com você?</p></button><button class="tile" data-act="quiz"><span class="arrow">↗</span><span class="bigicon">⚡</span><h2>Desafio tecnológico</h2><p>Teste seus conhecimentos e ganhe pontos.</p></button><button class="tile" data-act="estacoes"><span class="arrow">↗</span><span class="bigicon">🏅</span><h2>Passaporte SENAI</h2><p>Explore ambientes e colecione experiências.</p></button><button class="tile" data-act="programa"><span class="arrow">↗</span><span class="bigicon">🗓️</span><h2>Programação do dia</h2><p>Conheça oficinas, experiências e laboratórios.</p></button></section>`)}
function start(which){state.activity=which;state.index=0;state.answered=[];state.points=0;state.scores={};let source=which==='perfil'?'PERGUNTAS_PERFIL':'QUIZ_TECNOLOGIA';let max=Number(cfg(which==='perfil'?'quiz_qtd_perguntas':'desafio_qtd_perguntas'))||5;state.questions=shuffle(active(state.data[source])).slice(0,Math.max(1,max));if(!state.questions.length){panel('<h2>Atividade em preparação</h2><p>Cadastre perguntas na planilha para disponibilizar esta experiência.</p>');return}renderQuestion()}
function renderQuestion(){let q=state.questions[state.index],n=state.questions.length;let opts=['a','b','c','d'].filter(k=>q['alternativa_'+k]);panel(`<div class="pills"><span class="pill">${state.activity==='perfil'?'🧭 Meu perfil':'⚡ Desafio tecnológico'}</span><span class="pill">Pergunta ${state.index+1} de ${n}</span>${state.activity==='quiz'?'<span class="pill">⭐ '+state.points+' pontos</span>':''}</div><div class="progress">${Array.from({length:n},(_,i)=>`<span class="${i<=state.index?'done':''}"></span>`).join('')}</div><h2>${esc(q.pergunta)}</h2><div class="choices">${opts.map(k=>`<button class="choice" data-answer="${k}">${esc(q['alternativa_'+k])} <span style="opacity:.5;float:right">➜</span></button>`).join('')}</div><p class="small" style="margin-top:25px">${state.activity==='perfil'?'Não existe resposta certa ou errada. Descubra seus interesses!':'Escolha a alternativa correta para avançar.'}</p>`)}
function answer(k){if(state.busy)return;let q=state.questions[state.index];if(!q)return;state.answered.push({id:q.id,escolha:k});if(state.activity==='perfil'){let pid=q['perfil_'+k]||'';state.scores[pid]=(state.scores[pid]||0)+1;sound(540)}else{let correct=(q.correta||'').toLowerCase()===k;if(correct){state.points+=100;sound(850)}else sound(230,.13)}if(state.index+1<state.questions.length){state.index++;renderQuestion()}else finish()}
function finish(){let which=state.activity;if(which==='perfil'){let ranked=Object.entries(state.scores).sort((a,b)=>b[1]-a[1]);let id=(ranked[0]||['TI'])[0];let p=(state.data.PERFIS||[]).find(x=>x.id_perfil===id)||FALLBACK.PERFIS[1];state.lastResult=p.id_perfil;let course=active(state.data.CURSOS).filter(c=>c.id_perfil===p.id_perfil&&(c.unidade===state.unit||!c.unidade));panel(`<div class="result"><div class="medal">✨</div><div class="eyebrow">Seu perfil de interesse</div><h2>${esc(p.nome)}</h2><p style="font-size:21px">${esc(p.descricao)}</p></div><div class="info"><strong>💡 Profissões relacionadas</strong><p>${esc(p.profissoes||'Conheça novas oportunidades no SENAI.')}</p>${p.curiosidade?`<p>${esc(p.curiosidade)}</p>`:''}</div>${course.length?`<h3>Cursos para explorar</h3><div class="list">${course.slice(0,4).map(c=>`<div class="item"><strong>${esc(c.nome)}</strong><p>${esc(c.descricao_curta)}</p>${safeLink(c.url_curso)?`<a href="${esc(c.url_curso)}" target="_blank" rel="noopener" style="color:#7adefc">Saiba mais ↗</a>`:''}</div>`).join('')}</div>`:''}<div class="row center"><button class="primary" data-act="lead">Quero saber mais →</button><button class="secondary" data-act="perfil">Refazer experiência</button></div><p class="small" style="text-align:center">Este quiz é lúdico e não substitui orientação profissional.</p>`)}else{state.lastResult='QUIZ';let max=state.questions.length*100;panel(`<div class="result"><div class="medal">🏆</div><div class="eyebrow">Desafio concluído</div><h2>${state.points} de ${max} pontos!</h2><p>${state.points===max?'Incrível! Você acertou todas!':'Cada desafio é uma oportunidade de aprender.'}</p></div><div class="row center"><button class="primary" data-act="quiz">Jogar novamente ⚡</button><button class="secondary" data-act="lead">Conhecer cursos SENAI</button></div>`)}confetti();sound(980,.24)}
function safeLink(u){try{return ['https:','http:'].includes(new URL(u).protocol)}catch(_){return false}}
function stations(){state.activity='estacoes';let items=active(state.data.ESTACOES).filter(x=>x.id_unidade===state.unit);let visited=[];try{visited=JSON.parse(localStorage.getItem('ms_stations_'+state.unit)||'[]')}catch(_){}panel(`<div class="eyebrow">Explore os ambientes</div><h2>🏅 Passaporte Mundo SENAI</h2><p>Descubra os ambientes disponíveis. Nesta primeira versão, suas conquistas ficam salvas apenas neste navegador.</p><div class="pills"><span class="pill">${visited.length} visita(s) marcadas neste aparelho</span></div><div class="list">${items.length?items.map(s=>`<div class="item"><strong>${esc(s.nome)}</strong><p>${esc(s.local)} • ${esc(s.descricao)}</p><button class="secondary" data-station="${esc(s.id_estacao)}">${visited.includes(s.id_estacao)?'✓ Marcado neste aparelho':'Marcar visita neste aparelho'}</button></div>`).join(''):'<div class="item">A programação de estações está sendo preparada para esta unidade.</div>'}</div><p class="small">Atenção: o passaporte compartilhado entre dispositivos e a validação física de visitas exigirão uma etapa posterior. Não use esta marcação local como comprovação de presença.</p>`)}
function markStation(id){let arr=[];try{arr=JSON.parse(localStorage.getItem('ms_stations_'+state.unit)||'[]')}catch(_){}if(!arr.includes(id)){arr.push(id);try{localStorage.setItem('ms_stations_'+state.unit,JSON.stringify(arr))}catch(_){}sound(720);confetti()}stations()}
function program(){state.activity='programa';let rows=active(state.data.PROGRAMACAO).filter(x=>x.id_unidade===state.unit).sort((a,b)=>(a.data+' '+a.hora_inicio).localeCompare(b.data+' '+b.hora_inicio));panel(`<div class="eyebrow">Prepare sua visita</div><h2>🗓️ Programação e atividades</h2><div class="list">${rows.length?rows.map(x=>`<div class="item"><div class="pills"><span class="tag">${esc(x.data||'Data a confirmar')}</span><span class="tag">${esc(x.hora_inicio)} – ${esc(x.hora_fim)}</span><span class="tag">${esc(x.categoria)}</span></div><h3>${esc(x.titulo)}</h3><p>📍 ${esc(x.local)}<br>${esc(x.descricao)}</p></div>`).join(''):'<div class="item">A programação desta unidade será divulgada em breve.</div>'}</div>`)}
function unitSelect(){let units=active(state.data.UNIDADES);panel(`<h2>📍 Escolha sua unidade</h2><p>O conteúdo será filtrado para o local selecionado.</p><div class="choices">${units.map(u=>`<button class="choice" data-unit="${esc(u.id_unidade)}">${esc(u.nome)}<br><span class="muted">${esc(u.cidade||'')}</span></button>`).join('')}</div>`)}
function lead(){state.activity='lead';let url=cfg('url_appscript');panel(`<div class="eyebrow">Próximos passos</div><h2>🚀 Continue sua jornada</h2><p>Quer receber informações sobre as oportunidades do SENAI? Este cadastro é opcional.</p>${url?`<form id="leadForm"><label>Nome <input class="field" name="nome" maxlength="100" autocomplete="name" required></label><label>Contato (e-mail ou telefone) <input class="field" name="contato" maxlength="130" required></label><label style="display:flex;align-items:start;gap:10px"><input type="checkbox" name="aceite" required style="width:20px;height:20px"> <span class="small">${esc(cfg('texto_privacidade')||'Autorizo o contato para informações sobre cursos e oportunidades.')}</span></label><div class="row" style="margin-top:20px"><button type="submit" class="primary">Registrar meu interesse</button></div><p class="small">Não compartilhe dados pessoais de terceiros. Menores devem seguir as orientações de autorização aplicáveis.</p></form>`:`<div class="info"><strong>Cadastro em preparação</strong><p>O envio de contatos será habilitado após configurar a URL do Apps Script na aba CONFIG. Os demais jogos já funcionam.</p></div>`}<button class="secondary" data-act="home">Voltar às experiências</button>`)}
function leadSubmit(ev){
 ev.preventDefault();
 const url=cfg('url_appscript');
 if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec(?:\?.*)?$/.test(url||'')){alert('Informe uma URL de Apps Script /exec valida na CONFIG.');return;}
 const form=ev.target, fd=new FormData(form), btn=form.querySelector('button[type=submit]');
 const id='ms'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);
 const payload={id_registro:id,nome:String(fd.get('nome')||'').trim(),contato:String(fd.get('contato')||'').trim(),id_unidade:state.unit,atividade:state.lastResult||'EVENTO',consentimento:fd.get('aceite')?'SIM':'NAO',origem:'MUNDO_SENAI_WEB',id_sessao:id};
 if(payload.nome.length<2||payload.contato.length<6||payload.consentimento!=='SIM'){alert('Confira nome, contato e autorizacao.');return;}
 btn.disabled=true;btn.textContent='Enviando...';
 const iframe=document.createElement('iframe');iframe.name='ms_form_'+id;iframe.style.display='none';iframe.title='Envio de cadastro';document.body.appendChild(iframe);
 const post=document.createElement('form');post.method='POST';post.action=url;post.target=iframe.name;post.style.display='none';
 Object.entries(payload).forEach(([key,val])=>{const input=document.createElement('input');input.type='hidden';input.name=key;input.value=val;post.appendChild(input)});
 document.body.appendChild(post);post.submit();post.remove();
 let attempts=0,finished=false;
 function cleanup(){finished=true;delete window.msReceipt;try{iframe.remove()}catch(_){}}
 function check(){
  if(finished)return;
  if(++attempts>9){cleanup();btn.disabled=false;btn.textContent='Tentar novamente';alert('Nao foi possivel confirmar o registro. Antes de reenviar, verifique a planilha para evitar duplicidade.');return;}
  const cb='msReceipt'; const script=document.createElement('script');
  const timer=setTimeout(()=>{script.remove();if(!finished)setTimeout(check,650)},2200);
  window[cb]=function(r){clearTimeout(timer);script.remove();if(finished)return;if(r&&r.id===id&&r.saved){cleanup();panel('<div class="result"><div class="medal">✅</div><h2>Interesse registrado!</h2><p>Obrigado por participar do Mundo SENAI. Seus dados foram recebidos.</p></div><button class="primary" data-act="home">Voltar ao inicio</button>');}else setTimeout(check,650)};
  script.onerror=()=>{clearTimeout(timer);script.remove();if(!finished)setTimeout(check,650)};
  script.src=url+'?action=status&id='+encodeURIComponent(id)+'&callback='+cb+'&_='+Date.now();document.head.appendChild(script);
 }
 setTimeout(check,1000);
}
let inactivity;function resetTimer(){clearTimeout(inactivity);inactivity=setTimeout(()=>{if(state.activity!=='lead')home()},Math.max(30,Number(cfg('tempo_inatividade_seg'))||90)*1000)}['pointerdown','keydown','touchstart'].forEach(k=>document.addEventListener(k,resetTimer,{passive:true}));resetTimer();document.addEventListener('click',e=>{let b=e.target.closest('[data-act],[data-answer],[data-unit],[data-station]');if(!b)return;if(b.dataset.answer){answer(b.dataset.answer);return}if(b.dataset.unit){state.unit=b.dataset.unit;try{localStorage.setItem('ms_unit',state.unit)}catch(_){}setUnit();home();return}if(b.dataset.station){markStation(b.dataset.station);return}let a=b.dataset.act;if(a==='home')home();if(a==='perfil'||a==='quiz')start(a);if(a==='estacoes')stations();if(a==='programa')program();if(a==='lead')lead();});$('unitBtn').onclick=unitSelect;$('homeBtn').onclick=home;$('soundBtn').onclick=()=>{state.sound=!state.sound;$('soundBtn').textContent=state.sound?'🔊 Som':'🔇 Som';sound(640)};document.addEventListener('submit',e=>{if(e.target.id==='leadForm')leadSubmit(e)});load();
})();
</script></body></html>
