<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Links Úteis</title>
    <!-- Bootstrap CSS para estilo limpo e responsivo -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f4f6f9; 
            padding-top: 40px; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .header-title { 
            font-weight: 700; 
            color: #2c3e50;
        }
        .search-box {
            border-radius: 30px;
            padding: 15px 25px;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e1e5eb;
        }
        .search-box:focus {
            box-shadow: 0 4px 20px rgba(0,123,255,0.15);
            border-color: #80bdff;
        }
        .table-container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 5px 25px rgba(0,0,0,0.05); 
            margin-top: 20px;
            margin-bottom: 50px;
        }
        .badge-tipo {
            font-size: 0.85em;
            padding: 6px 10px;
            border-radius: 6px;
        }
        .btn-acessar {
            border-radius: 20px;
            padding: 6px 20px;
            font-weight: 600;
        }
        .table>tbody>tr>td {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mb-5">
            <h1 class="header-title">🔗 Central de Links Úteis</h1>
            <p class="text-muted fs-5">Acesse rapidamente os documentos e sistemas de cada departamento</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-10">
                <!-- Barra de Pesquisa -->
                <input type="text" id="searchInput" class="form-control search-box mb-4" placeholder="🔍 Busque por departamento, tipo ou título da página...">
                
                <div class="table-container">
                    <div id="loading" class="text-center my-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Carregando...</span>
                        </div>
                        <p class="mt-3 text-muted">Buscando os links atualizados...</p>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover d-none" id="linksTable">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col" width="20%">Departamento</th>
                                    <th scope="col" width="15%">Tipo</th>
                                    <th scope="col" width="45%">Título do Documento</th>
                                    <th scope="col" width="20%" class="text-center">Ação</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <!-- As linhas da tabela serão inseridas aqui dinamicamente -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Biblioteca PapaParse para ler e processar o arquivo CSV do Google Sheets com facilidade -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script>
        // URL da planilha fornecida
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS4zCn8oMbQMBJKRw4j2Qd4AQBOZs1X-U5JPc0DgyuRF_GJIs_WsZLxWHJyRnUjdnRdtpWiloHn9GaM/pub?output=csv';
        let allData = [];

        // Quando o documento for carregado, inicia o processo
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            
            // Adiciona o evento de filtro (disparado ao digitar na barra de pesquisa)
            document.getElementById('searchInput').addEventListener('input', function(e) {
                const term = e.target.value.toLowerCase();
                filterData(term);
            });
        });

        // Função para carregar e converter os dados do CSV
        function loadData() {
            Papa.parse(csvUrl, {
                download: true,
                header: false, // Vamos trabalhar com índices: 0=Dept, 1=Tipo, 2=Título, 3=URL
                skipEmptyLines: true,
                complete: function(results) {
                    let data = results.data;
                    
                    // Ignora a primeira linha se for cabeçalho (ex: "Departamento", "Tipo")
                    if (data.length > 0 && data[0][0].toLowerCase().includes('departamento')) {
                        data.shift(); 
                    }

                    // Armazena todos os dados garantindo que tenham pelo menos 4 colunas (A a D)
                    allData = data.filter(row => row.length >= 4);
                    
                    // Oculta o loading e exibe a tabela
                    document.getElementById('loading').classList.add('d-none');
                    document.getElementById('linksTable').classList.remove('d-none');
                    
                    // Renderiza a tabela inicial com todos os dados
                    renderTable(allData);
                },
                error: function(error) {
                    console.error("Erro ao carregar o CSV:", error);
                    document.getElementById('loading').innerHTML = '<p class="text-danger fw-bold">Erro ao carregar os dados. Verifique a sua conexão ou se a planilha está acessível publicamente.</p>';
                }
            });
        }

        // Função para montar a tabela no HTML
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; // Limpa a tabela atual
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">Nenhum link correspondente encontrado.</td></tr>';
                return;
            }

            data.forEach(row => {
                const departamento = row[0] || '-';
                const tipo = row[1] || '-';
                const titulo = row[2] || '-';
                const link = row[3] || '#';

                const tr = document.createElement('tr');
                
                // Estrutura de cada linha
                tr.innerHTML = `
                    <td class="fw-medium text-secondary">${departamento}</td>
                    <td><span class="badge bg-info text-dark badge-tipo">${tipo}</span></td>
                    <td class="fw-bold text-dark">${titulo}</td>
                    <td class="text-center">
                        <a href="${link}" target="_blank" rel="noopener noreferrer" class="btn btn-primary btn-sm btn-acessar shadow-sm">
                            Abrir Link ↗
                        </a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Função de filtro para a barra de pesquisa
        function filterData(term) {
            const filtered = allData.filter(row => {
                const departamento = (row[0] || '').toLowerCase();
                const tipo = (row[1] || '').toLowerCase();
                const titulo = (row[2] || '').toLowerCase();
                // Retorna verdadeiro se o termo pesquisado existir em qualquer uma das colunas (exceto a URL)
                return departamento.includes(term) || tipo.includes(term) || titulo.includes(term);
            });
            renderTable(filtered);
        }
    </script>
</body>
</html>
